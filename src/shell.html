<!DOCTYPE html>
<html lang="en-AU" data-fm-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<div id="app">
  <header class="topbar">
    <button class="btn icon ghost mob-only" data-act="menu" aria-label="Open menu"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <button class="logo" data-act="home" aria-label="FlowMate — all projects">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="14" y="3" width="12" height="10" rx="3.5" fill="#EDB54F"/><rect x="3" y="27" width="12" height="10" rx="3.5" fill="#E2805F"/><rect x="25" y="27" width="12" height="10" rx="3.5" fill="#E2805F"/><path d="M20 13v6M9 27v-5h22v5" stroke="#E2805F" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>FlowMate</span>
    </button>
    <div class="divider desk-only"></div>
    <button class="proj-switch" data-act="home" id="projName" aria-label="Switch project"><span>My App</span><svg class="ic" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="top-spacer desk-only"></div>
    <div class="search desk-only"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><label for="q" class="sr">Search the project</label><input id="q" type="search" placeholder="Search…" autocomplete="off"><div id="qres" class="search-results" hidden></div></div>
    <button class="btn icon ghost mob-only" data-act="search-mobile" aria-label="Search"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
    <button class="btn desk-only" data-act="details"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></svg><span class="lbl">App details</span></button>
    <button class="btn primary desk-only" data-act="add-page"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Page</button>
    <button class="btn desk-only" data-act="add-menu" id="addMenuBtn" aria-label="Add another kind of card"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">More</span></button>
    <button class="btn desk-only" data-act="export"><svg class="ic" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 13v7h14v-7"/></svg><span class="lbl">Export</span></button>
    <button class="btn icon mob-only" data-act="export" aria-label="Export"><svg class="ic" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 13v7h14v-7"/></svg></button>
  </header>
  <div class="main">
    <nav class="sidebar" id="sidebar" aria-label="FlowMate tools"></nav>
    <main class="canvas-wrap" id="viewport" tabindex="-1" aria-label="Canvas">
      <div id="world"><div id="frames"></div><svg id="edges" xmlns="http://www.w3.org/2000/svg"></svg><div id="elabels"></div><div id="cards"></div></div>
      <div class="crumbs" id="crumbs"></div>
      <div id="traceBar" hidden></div>
      <canvas id="minimap" width="400" height="256" aria-label="Mini-map. Tap to move there."></canvas>
      <div class="overlay ov-bl desk-only" id="ovUndo">
        <button class="btn icon ghost" data-act="undo" aria-label="Undo" title="Undo (Ctrl+Z)"><svg class="ic" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
        <button class="btn icon ghost lkey-btn" data-act="lkey" aria-label="Link key and filter" aria-expanded="false" title="Link key"><svg class="ic" viewBox="0 0 24 24"><path d="M3 7h9M3 12h4M10 12h4M3 17h1.5M8 17h1.5M13 17h1.5"/><path d="M15 4l4 3-4 3z" fill="currentColor"/></svg></button>
        <button class="btn icon ghost" data-act="redo" aria-label="Redo" title="Redo (Ctrl+Y)"><svg class="ic" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
      </div>
      <div class="overlay ov-tr" id="ovMid"></div>
      <div class="overlay ov-bc"><button class="sa-btn" data-act="sa-open" id="saBtn"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z"/></svg>Smart Action</button></div>
      <div id="lkey" role="group" aria-label="Link key and filter" hidden></div>
      <div class="overlay ov-br">
        <button class="btn icon ghost lkey-btn mob-only" data-act="lkey" aria-label="Link key and filter" aria-expanded="false" title="Link key"><svg class="ic" viewBox="0 0 24 24"><path d="M3 7h9M3 12h4M10 12h4M3 17h1.5M8 17h1.5M13 17h1.5"/><path d="M15 4l4 3-4 3z" fill="currentColor"/></svg></button>
        <button class="btn icon ghost" data-act="view-back" aria-label="Go back to previous spot" title="Previous spot"><svg class="ic" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
        <button class="btn icon ghost" data-act="fit" aria-label="Fit whole project" title="Fit everything (F)"><svg class="ic" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button class="btn icon ghost" data-act="zoom-out" aria-label="Zoom out"><svg class="ic" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        <button class="zoom-pct" data-act="zoom-reset" id="zoomPct" aria-label="Zoom to 100%">100%</button>
        <button class="btn icon ghost" data-act="zoom-in" aria-label="Zoom in"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
            <button class="btn primary fab mob-only" data-act="add-page"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Page</button>
      <div id="panel" hidden></div>
      <div id="dropMenu" class="drop-menu" hidden></div>
      <div class="empty-hint" id="emptyHint" hidden></div>
    </main>
    <aside id="editor" class="hide" aria-label="Editor"></aside>
  </div>
</div>
<div id="home" class="hide"></div>
<div id="modal" class="hide" role="dialog" aria-modal="true"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<div id="toast" class="toast" hidden role="status"></div>
