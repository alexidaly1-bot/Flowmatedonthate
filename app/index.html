.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r);padding:10px 12px;min-height:48px}
.li:hover{border-color:var(--oak)}
.li small{display:block;color:var(--ink-2);font-size:.82rem}
.li .grow{flex:1;min-width:0}
.issue{border-left:5px solid var(--bad)}
.issue.check{border-left-color:var(--gold)}
.mod-h{font-family:var(--font-display);font-weight:700;margin:14px 2px 4px;display:flex;align-items:center;gap:8px}
.mod-dot{width:12px;height:12px;border-radius:50%;background:var(--mc)}

/* Editor */
#editor{width:400px;background:var(--bar);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:22}
#editor.hide{display:none}
.ed-grip{display:none}
.ed-head{display:flex;align-items:center;gap:12px;padding:16px 18px 10px}
.ed-head .tile{width:48px;height:48px;border-radius:var(--r);background:var(--blush);display:grid;place-items:center;color:var(--coral-text)}
.ed-head .tile .ic{width:26px;height:26px}
.ed-head h2{font-size:1.45rem;flex:1}
.ed-body{flex:1;overflow:auto;padding:4px 18px 18px}
.ed-foot{padding:12px 18px 16px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.ed-foot .btn{flex:1}
.field{margin:14px 0}
.field>label,.flabel{display:block;font-weight:700;margin-bottom:6px}
.help{font-size:.86rem;color:var(--ink-2);margin:4px 0 0}
.inp{width:100%;min-height:48px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--card);padding:10px 14px}
.inp.big{font-size:1.25rem;font-weight:700;background:color-mix(in srgb,var(--blush) 55%,var(--card))}
textarea.inp{min-height:96px;resize:vertical}
select.inp{appearance:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1.5px solid transparent;border-radius:var(--r-pill);min-height:42px;padding:0 16px;font-weight:700;background:var(--row)}
.chips button.on{background:var(--gold-fill);color:var(--on-gold)}
.chips button.on::before{content:"✓ "}
.elrow{background:color-mix(in srgb,var(--blush) 60%,var(--card));border-radius:var(--r);padding:10px;margin-bottom:8px;display:grid;gap:8px}
.elrow.sel{outline:3px solid var(--gold)}
.elrow .r1{display:flex;gap:6px;align-items:center}.elrow .r1 .inp{flex:1;min-width:0}
.elrow .r1 .inp{min-height:42px}
.elrow .r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.elrow .r2 .inp{min-height:42px;font-size:.92rem;padding:6px 10px}
.mini{border:0;background:var(--card);border-radius:var(--r);min-width:34px;min-height:38px;flex:none;display:grid;place-items:center}
.mini:hover{background:var(--row)}
.connrow{display:grid;gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:8px}
.connrow .top{display:flex;gap:8px;align-items:center;font-size:.92rem}
.connrow .top b{flex:1;min-width:0}
.connrow .r{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.connrow .inp{min-height:40px;font-size:.9rem;padding:6px 10px}
.swatch{display:inline-block;width:22px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
.sec-h{font-family:var(--font-display);font-weight:700;font-size:1.05rem;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
.sec-h .count{font-family:var(--font-body);font-size:.8rem;color:var(--ink-2);font-weight:400}
.plain{background:color-mix(in srgb,var(--gold) 18%,var(--card));border-radius:var(--r);padding:10px 12px;font-size:.9rem}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}

/* Dashboard + modal */
#home{position:fixed;inset:0;z-index:50;background:var(--canvas);overflow:auto;padding:28px 20px 60px}
#home.hide,#modal.hide{display:none}
.home-in{max-width:1040px;margin:0 auto}
.home-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:24px}
.home-top h1{font-size:1.7rem;flex:1}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.pcard{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.pcard h3{font-size:1.2rem}
.pcard p{margin:0;color:var(--ink-2);font-size:.92rem}
.pcard .stats{display:flex;gap:8px;flex-wrap:wrap}
#modal{position:fixed;inset:0;z-index:95;background:rgba(40,25,20,.45);display:grid;place-items:center;padding:16px}
.mbox{background:var(--bar);border-radius:var(--r-lg);box-shadow:var(--shadow);width:min(640px,100%);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;min-height:0}
.mbox.wide{width:min(900px,100%)}
.mhead{display:flex;gap:14px;align-items:center;padding:22px 24px 8px}
.mhead .tile{width:56px;height:56px;border-radius:var(--r-lg);background:var(--blush);display:grid;place-items:center;color:var(--coral-text)}
.mhead .tile .ic{width:30px;height:30px}
.mhead h2{font-size:1.6rem}
.mhead p{margin:2px 0 0;color:var(--ink-2)}
.mhead .x{margin-left:auto}
.mbody{padding:8px 24px 12px;overflow:auto;min-height:0;flex:1 1 auto}
.mfoot{display:flex;gap:10px;justify-content:flex-end;padding:12px 24px 22px;flex-wrap:wrap}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--card);margin-bottom:8px;cursor:pointer}
.opt input{margin-top:5px;width:20px;height:20px;accent-color:var(--coral)}
.opt.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,var(--card))}
.opt small{display:block;color:var(--ink-2)}
pre.out{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:12px;max-height:280px;overflow:auto;font-size:.8rem;white-space:pre-wrap;word-break:break-word}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--canvas);padding:12px 20px;border-radius:var(--r-pill);z-index:100;font-weight:700;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast .btn{min-height:32px;margin-left:10px;background:transparent;color:inherit;border-color:currentColor}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--ink-2)}
.dotst{width:8px;height:8px;border-radius:50%;background:var(--oak)}
.dotst.ok{background:#6FA35F}.dotst.err{background:var(--bad)}.dotst.busy{background:var(--gold)}
.mob-only{display:none !important}
.roadmap li{margin:6px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.9rem}

/* Smart Action */
.ov-bc{left:50%;transform:translateX(-50%);bottom:16px;background:none;border:0;box-shadow:none;padding:0}
.sa-btn{background:var(--coral-fill);color:var(--on-fill);border:0;min-height:52px;padding:0 24px;border-radius:var(--r-pill);font-weight:800;font-size:1.05rem;box-shadow:0 10px 24px -8px rgba(160,70,40,.55);display:inline-flex;gap:9px;align-items:center;white-space:nowrap}
.sa-btn .ic{width:1.3em;height:1.3em;fill:currentColor;stroke:none}
.sa-btn:hover{filter:brightness(1.07)}
.sa-scope{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.sa-in-wrap{position:relative}
.sa-in{min-height:120px;padding-right:70px;font-size:1.08rem;line-height:1.5}
.mic{position:absolute;right:10px;top:10px;width:50px;height:50px;border-radius:50%;border:0;background:var(--blush);color:var(--coral-text);display:grid;place-items:center}
.mic .ic{width:24px;height:24px}
.mic.on{background:var(--coral-fill);color:var(--on-fill);animation:fm-pulse 1.3s infinite}
@keyframes fm-pulse{50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--coral) 28%,transparent)}}
.sa-partial{color:var(--ink-2);font-style:italic;min-height:1.3em;font-size:.92rem;margin:6px 2px 0}
.sugs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.sugs button{border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-pill);min-height:42px;padding:6px 14px;font-size:.92rem;text-align:left;display:inline-flex;gap:8px;align-items:center}
.sugs button:hover{border-color:var(--oak)}
.sa-think{display:flex;gap:12px;align-items:center;padding:16px;border-radius:var(--r);background:var(--card);border:1.5px solid var(--line);margin-top:14px}
.spinner{width:24px;height:24px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--coral);animation:fm-spin 1s linear infinite;flex:none}
@keyframes fm-spin{to{transform:rotate(360deg)}}
.saopt{display:block;padding:14px 16px;border-radius:var(--r-lg);border:1.5px solid var(--line);background:var(--card);margin-top:10px;cursor:pointer}
.saopt.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--card))}
.saopt .top{display:flex;gap:12px;align-items:flex-start}
.saopt input{width:22px;height:22px;margin-top:2px;accent-color:var(--coral);flex:none}
.saopt b{font-size:1.05rem}
.saopt .why{display:block;color:var(--ink-2);font-size:.92rem;margin-top:2px}
.oplines{list-style:none;padding:0;margin:10px 0 0 34px;display:grid;gap:5px;font-size:.9rem}
.oplines li{display:flex;gap:8px;align-items:flex-start}
.oplines li .ic{margin-top:2px}
.t-add .ic{color:var(--ok-ink)} .t-link .ic{color:var(--e-nav)} .t-edit .ic{color:var(--e-fn)} .t-del,.t-skip{color:var(--bad)} .t-same{color:var(--ink-2)}
.sa-note{font-size:.86rem;color:var(--ink-2);margin-top:10px}
.sa-err{background:var(--bad-bg);color:var(--bad);border-radius:var(--r);padding:12px 14px;margin-top:12px}

/* Live Preview: Screens canvas */
.seg button .ic{width:1.05em;height:1.05em;margin-right:5px;vertical-align:-3px}
.ov-tr .btn.primary .ic{fill:currentColor}
.dev-sel{min-height:38px;width:auto;padding:4px 10px;border-radius:999px;font-size:.88rem}
.elabel.r{transform:translate(calc(-100% - 6px),-100%);max-width:260px;overflow:hidden;text-overflow:ellipsis}
.card.scard{width:auto;padding:10px 10px 12px;border-radius:var(--r-lg)}
.mode-screens .crumbs{display:none}
.scard .hd{padding:0 6px 8px;flex-wrap:wrap;row-gap:4px}
.scard .hd .chip{font-size:11px}
.scard.drop .dev{box-shadow:0 0 0 5px var(--gold)}
.dev{border:7px solid #2B2524;border-radius:32px;overflow:hidden;background:#2B2524;contain:layout paint;position:relative}
.dev-tablet{border-width:10px;border-radius:26px}
.dev-web{border-width:2px;border-radius:12px}
.scr-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--card);color:var(--ink-2);font-family:var(--font-display);font-weight:700;font-size:30px;text-align:center;padding:20px}
.scr-ph small{font-family:var(--font-body);font-weight:400;font-size:18px}
.scr{background:var(--ap-bg);color:var(--ap-text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:calc(15px * var(--ap-fs));display:flex;flex-direction:column;line-height:1.35;user-select:none;-webkit-user-select:none}
.scr .ic{width:18px;height:18px;flex:none}
.scr-status{display:flex;justify-content:space-between;padding:6px 18px 2px;font-size:11px;font-weight:600;opacity:.75;letter-spacing:.02em}
.scr-url{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--ap-surface);border-bottom:1px solid var(--ap-line);font-size:12px}
.scr-url i{width:10px;height:10px;border-radius:50%;background:var(--ap-line)}
.scr-url span{margin-left:10px;background:var(--ap-bg);border-radius:999px;padding:3px 14px;opacity:.8}
.scr-top{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:calc(17px * var(--ap-fs));border-bottom:1px solid var(--ap-line)}
.scr-top .bk{display:grid;place-items:center;width:32px;height:32px;border-radius:50%}
.scr-big{padding:14px 18px 2px;font-size:calc(27px * var(--ap-fs));font-weight:800;letter-spacing:-.01em}
.scr-body{flex:1;padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px}
.scr-foot{padding:10px 16px 18px;border-top:1px solid var(--ap-line)}
.scr-empty{border:2px dashed var(--ap-line);border-radius:var(--ap-r);padding:30px 12px;text-align:center;opacity:.65;margin:0}
.scr.sheet{border-radius:var(--ap-r) var(--ap-r) 0 0}
.grab{width:44px;height:5px;border-radius:3px;background:var(--ap-line);margin:8px auto 0}
.sp{position:relative;border-radius:calc(var(--ap-r) * .55)}
.sp.sel{outline:3px solid var(--gold);outline-offset:3px}
.sp.dead{outline:2px dashed #C2453A;outline-offset:2px}
.sp-bad{position:absolute;top:-9px;left:-9px;width:20px;height:20px;border-radius:50%;background:#C2453A;color:#fff;font-size:13px;display:grid;place-items:center;z-index:2;font-family:var(--font-body)}
.sp-port{right:-14px}
.mode-screens .scard .sp{cursor:grab}
.sp-btn{min-height:48px;display:flex;align-items:center;justify-content:center;font-weight:700;border-radius:var(--ap-r);background:var(--ap);color:var(--ap-ink);padding:0 16px;text-align:center}
.sp-btn.out{background:transparent;color:var(--ap-text);box-shadow:inset 0 0 0 2px var(--ap)}
.sp-link{color:var(--ap-link);font-weight:600;text-decoration:underline;padding:4px 2px;align-self:flex-start}
.sp-tabs{display:flex;gap:4px;background:var(--ap-surface);border-radius:var(--ap-r);padding:4px}
.sp-tab{flex:1;min-width:0;text-align:center;padding:9px 4px;border-radius:calc(var(--ap-r) - 4px);font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-tab.on{background:var(--ap-bg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sp-li,.sp-mi{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--ap-surface);border-radius:calc(var(--ap-r) * .6)}
.sp-li .av{width:38px;height:38px;border-radius:50%;background:color-mix(in srgb,var(--ap) 25%,var(--ap-surface));display:grid;place-items:center;flex:none}
.sp-li .t,.sp-mi .t{flex:1;min-width:0;font-weight:600}
.sp-li small{display:block;font-weight:400;opacity:.6;font-size:12.5px}
.sp-li.faint{opacity:.45}
.sp-tg{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px}
.sp-tg .t{font-weight:600}
.sw{width:46px;height:28px;border-radius:14px;background:var(--ap-line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.sw.on{background:var(--ap)}
.sw.on::after{left:21px}
.sp-in label{display:block;font-size:12.5px;opacity:.75;margin-bottom:4px;font-weight:600}
.sp-in .box{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:44px;border:1.5px solid var(--ap-line);border-radius:calc(var(--ap-r) * .5);padding:8px 12px;background:var(--ap-bg);color:var(--ap-text);font:inherit}
.sp-img{height:130px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ap-surface),color-mix(in srgb,var(--ap) 30%,var(--ap-surface)));border-radius:calc(var(--ap-r) * .6)}
.sp-img .ic{width:32px;height:32px;opacity:.6}
.sp-sec h4{margin:2px 0 6px;font-size:calc(16px * var(--ap-fs))}
.sp-sec .ln{height:8px;border-radius:4px;background:var(--ap-line);margin-top:6px}
.sp-hero{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;margin:14px auto 4px}
.sp-hero .ic{width:42px;height:42px;stroke-width:2.5}
.sp-hero.ok{background:color-mix(in srgb,#5E9C55 20%,var(--ap-bg));color:#3F7A37}
.sp-hero.err{background:color-mix(in srgb,#C2453A 18%,var(--ap-bg));color:#B23A30}
.sp-hero.logo{background:var(--ap);color:var(--ap-ink);font-size:38px;font-weight:800;border-radius:24px}
.dragghost{position:fixed;z-index:120;pointer-events:none;transform:translate(12px,12px);background:var(--coral-fill);color:var(--on-fill);font-weight:700;padding:8px 14px;border-radius:var(--r-pill);box-shadow:var(--shadow)}
.dline{position:fixed;z-index:119;pointer-events:none;background:var(--coral);border-radius:3px;box-shadow:0 0 0 2px var(--card)}
#tray{position:absolute;left:16px;top:64px;z-index:15;display:flex;flex-direction:column;gap:4px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:8px;box-shadow:var(--shadow);max-height:calc(100% - 250px);overflow:auto;touch-action:none}
#tray[hidden]{display:none}
.tray-h{font-size:.75rem;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;padding:2px 8px}
.tpart{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border:0;background:var(--row);border-radius:var(--r);font-weight:700;font-size:.88rem;cursor:grab;text-align:left;touch-action:none;white-space:nowrap}
.tpart:hover{background:var(--blush)}
.tpart.new{background:var(--coral-fill);color:var(--on-fill)}
.wobble{animation:fm-wob .3s}
@keyframes fm-wob{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* Play */
#play{position:fixed;inset:0;z-index:80;background:var(--canvas);display:flex;flex-direction:column}
#play[hidden]{display:none}
.pl-top{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--bar);border-bottom:1px solid var(--line);flex-wrap:wrap}
.pl-title{display:flex;align-items:center;gap:6px;font-family:var(--font-display);font-size:1.15rem}
.pl-title .ic{fill:var(--coral);stroke:var(--coral)}
.pl-sim{font-size:.8rem;background:var(--warn-bg);color:var(--warn-ink);border-radius:var(--r-pill);padding:2px 10px;font-weight:700}
.pl-sp{flex:1}
.pl-sel{min-height:36px;width:auto;padding:4px 8px;font-size:.88rem;border-radius:var(--r-pill)}
.pl-rp{font-weight:700;font-size:.92rem}
.pl-main{flex:1;min-height:0;display:grid;grid-template-columns:230px 1fr 260px;position:relative}
.pl-trail{list-style:none;margin:0;padding:12px;overflow:auto;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.pl-trail button{width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r);padding:8px 10px;font-size:.9rem;font-weight:700}
.pl-trail button b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--row);font-size:.75rem;margin-right:6px}
.pl-trail button.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,var(--card))}
.pl-trail small{display:block;color:var(--ink-2);font-size:.78rem;margin-top:2px;font-weight:400}
.pl-stage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;min-width:0;min-height:0;overflow:hidden}
.pl-fit{position:relative;flex:none}
.pl-dev{transform-origin:0 0;position:absolute;left:0;top:0;box-shadow:0 30px 60px -20px rgba(60,30,20,.45);box-sizing:content-box}
.pl-dev>.scr{overflow:auto}
.pl-dev [data-pl],.pl-dev [data-plback]{cursor:pointer}
.pl-dev [data-pl]:hover{filter:brightness(.96)}
.pl-dev [data-pl]:focus-visible,.pl-dev [data-plback]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pl-under{pointer-events:none;height:100%}
.pl-under .scr{height:100% !important}
.pl-dim{position:absolute;inset:0;background:rgba(0,0,0,.42)}
.pl-over{position:absolute;left:0;right:0;bottom:0;max-height:80%;display:flex}
.pl-over .scr{height:auto !important;max-height:100%;width:100% !important;overflow:auto}
.pl-strip{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:560px}
.pl-strip[hidden]{display:none}
.pl-strip span{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-pill);padding:4px 12px;font-size:.85rem}
.pl-info{border-left:1px solid var(--line);padding:12px;overflow:auto;font-size:.9rem}
.pl-info.folded .pl-ibody{display:none}
.pl-ifold{border:0;background:none;font-weight:700;font-family:var(--font-display);padding:4px 0;margin-bottom:6px;font-size:1rem}
.pl-info ul{margin:4px 0 12px;padding-left:18px}
.pl-sheet{position:fixed;inset:0;background:rgba(40,25,20,.38);display:grid;place-items:center;z-index:85;padding:16px}
.pl-card{background:var(--bar);border-radius:var(--r-lg);padding:20px;width:min(440px,100%);box-shadow:var(--shadow);max-height:calc(100dvh - 40px);overflow:auto}
.pl-card h3{font-size:1.25rem;margin-bottom:6px}
.pl-card p{white-space:pre-line;color:var(--ink-2);margin:0 0 12px}
.pl-card .btn{width:100%;justify-content:space-between;margin-top:8px;white-space:normal;text-align:left;min-height:50px}
.pl-card .btn small{font-weight:400;opacity:.85}
@media (max-width:1000px){.pl-main{grid-template-columns:1fr;grid-template-rows:1fr auto auto}.pl-trail{order:2;flex-direction:row;overflow-x:auto;border:0;border-top:1px solid var(--line);padding:8px}.pl-trail li{flex:none}.pl-trail button{width:auto;white-space:nowrap}.pl-trail small{display:none}.pl-stage{order:1}.pl-info{order:3;border:0;border-top:1px solid var(--line);max-height:28vh}.lbl2{display:none}.pl-sim{display:none}}
/* Page web */
#web{position:fixed;inset:0;z-index:92;background:rgba(40,25,20,.45);display:grid;place-items:center;padding:12px}
#web[hidden]{display:none}
.web-box{background:var(--bar);border-radius:var(--r-lg);width:min(720px,100%);max-height:calc(100dvh - 24px);overflow:auto;padding:16px 18px;box-shadow:var(--shadow)}
.web-h{display:flex;align-items:center;gap:10px}
.web-h b{font-family:var(--font-display);font-size:1.3rem}
.web-h span{color:var(--ink-2);flex:1;font-size:.92rem}
.web-box svg{width:100%;height:auto;display:block}
.web-box [data-wnode]{cursor:pointer;outline:none}
.web-box [data-wnode]:hover rect,.web-box [data-wnode]:focus rect{stroke-width:3.5}
.web-key{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--ink-2)}
.web-key i{display:inline-block;width:18px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
@media (max-width:760px){.ov-tr .dev-sel,.mode-screens .ov-tr [data-act=tidy]{display:none}#tray{left:8px;right:8px;top:62px;flex-direction:row;max-height:none;overflow-x:auto;border-radius:var(--r-lg);padding:6px}.tray-h{display:none}.mode-screens .crumbs{display:none}}

/* Tablet / unfolded Fold */
@media (max-width:1100px){ #editor{width:340px} .topbar .lbl{display:none} .topbar .btn:has(.lbl){padding:0 12px} .logo span{display:none} .sidebar{width:68px} .sidebar .nav span,.sidebar .nav .badge,.sidebar .nav .tag,.sidebar .nav-label,.sidebar .proj-card div{display:none} .search input{width:150px} }
/* Phones / folded Fold */
@media (max-width:760px){
  .mob-only{display:inline-flex !important}
  .desk-only{display:none !important}
  .topbar{padding:8px 10px;gap:6px}
  .logo span{display:none}
  .proj-switch{max-width:none;flex:1;padding:0 8px;font-size:1rem}
  .main{grid-template-columns:1fr}
  .sidebar{position:absolute;left:0;top:0;bottom:0;width:260px;transform:translateX(-105%);transition:transform .2s;box-shadow:var(--shadow);z-index:45}
  .sidebar .nav span,.sidebar .nav .badge,.sidebar .nav .tag,.sidebar .nav-label,.sidebar .proj-card div{display:revert}
  .sidebar.open{transform:none}
  #editor{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:72%;border-radius:var(--r-lg) var(--r-lg) 0 0;border:1px solid var(--line);box-shadow:0 -10px 30px -10px rgba(60,30,20,.35);z-index:40}
  #editor.tall{max-height:94%}
  .ed-grip{display:block;width:64px;height:6px;border-radius:3px;background:var(--line);margin:10px auto 0;border:0;padding:0}
  #panel{width:100%;z-index:44}
  #minimap{display:none}
  .ov-tr{top:12px;right:12px}
  .ov-tr .seg button{padding:0 9px;font-size:.8rem}
  .trace-bar{top:66px;left:12px}
  .ov-bl{bottom:16px}
  .search-results{position:fixed;left:8px;right:8px;width:auto;top:64px}
  .crumbs{display:none}
  .fab{position:absolute;right:16px;bottom:84px;z-index:16}
  .zoom-hint{display:none}
  .ov-bc{left:16px;transform:none;bottom:84px}
  .sa-btn{min-height:50px;padding:0 18px}
}

/* =========================================================
   Appearance system. Colours come from the theme tokens (see FMT in <head>).
   Shapes and layout details change per theme via data-fm-theme.
   ========================================================= */
:root{--r-sm:var(--fm-radius-sm,6px);--r:var(--fm-radius,12px);--r-lg:var(--fm-radius-lg,20px);--bw:var(--fm-border-width,1px);--r-pill:999px;--card-border:var(--line);--card-bw:max(1.5px,var(--bw));--btn-bw:1.5px;--btn-border:var(--line);--sel:var(--coral);--overlay-bg:var(--overlay,rgba(0,0,0,.45));--cts:1}
:root[data-fm-theme="orbit-system"],:root[data-fm-theme="mono-studio"]{--r-pill:var(--r)}
:root[data-fm-theme="bold-play"]{--r-pill:var(--r-lg);--card-border:var(--ink);--card-bw:2px;--btn-bw:2px;--btn-border:var(--ink)}
:root[data-contrast="high"]{--card-border:var(--ink);--card-bw:2.5px;--btn-border:var(--ink)}

body{letter-spacing:var(--fm-letter-spacing,0);line-height:var(--fm-line-height,1.45)}
::placeholder{color:var(--ink-2);opacity:1}
*{scrollbar-color:var(--line) transparent}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--coral)}
select{background-color:var(--card);color:var(--ink)}
.nav-label{text-transform:none;letter-spacing:0;font-weight:700}

/* Focus: double ring that shows on every background */
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 2px var(--card)}

/* Buttons */
.btn{border-width:var(--btn-bw);border-color:var(--btn-border)}
.btn.primary,.btn.gold{border-color:var(--btn-border)}
:root:not([data-fm-theme="bold-play"]):not([data-contrast="high"]) .btn.primary{border-color:var(--coral-fill)}
:root:not([data-fm-theme="bold-play"]):not([data-contrast="high"]) .btn.gold{border-color:var(--gold-fill)}
.btn.primary:hover{filter:none;background:var(--coral-fill);box-shadow:0 0 0 3px var(--blush)}
.btn.ghost{border-color:transparent}
.btn[disabled]{opacity:1;color:var(--ink-2);background:var(--row);border-style:dashed;border-color:var(--line)}
.sa-btn{box-shadow:var(--shadow)}
.nav.on{background:var(--coral-fill);color:var(--on-fill)}
.nav .badge{color:var(--bad)}
.chips button{border-color:var(--line)}
.chips button.on{border-color:var(--btn-border)}
.seg button.on{box-shadow:0 0 0 var(--card-bw) var(--line)}
.dotst.ok{background:var(--ok-ink)}
.card.dragging{box-shadow:var(--shadow)}
#modal,.pl-sheet,#web{background:var(--overlay-bg)}
.pl-card .btn small{opacity:1}
.plain{background:var(--fm-soft);border:1px solid var(--line)}
.opt.on,.saopt.on,.pl-trail button.on{border-color:var(--sel);background:var(--blush)}
.trace-bar{border-color:var(--sel)}
.elrow.sel,.sp.sel{outline-color:var(--sel)}
.inp.big{background:var(--card)}
.elrow{background:var(--row)}

/* Status chips: written label + symbol, never colour alone */
.chip[class*="st-"]{display:inline-flex;align-items:center;gap:.35em}
.chip[class*="st-"]::before{content:"";width:1em;height:1em;flex:none;background:currentColor;-webkit-mask:var(--gl) center/contain no-repeat;mask:var(--gl) center/contain no-repeat}
.st-done{--gl:var(--g-tick)}
.st-in-progress{--gl:var(--g-tri)}
.st-blocked{--gl:var(--g-oct);color:var(--bad)}
.st-review,.st-new{--gl:var(--g-tag)}
.st-planned,.st-idea,.st-deprecated{--gl:var(--g-minus)}
.chip{border:1px solid color-mix(in srgb,currentColor 35%,transparent)}

/* Canvas grid */
:root[data-grid="off"] .canvas-wrap{background-image:none}

/* Cards on the canvas */
.card{background:var(--card);border:var(--card-bw) solid var(--card-border);border-radius:var(--r-lg)}
.card .ttl{font-family:var(--font-body);font-size:calc(17px * var(--cts))}
.card .kind{font-size:calc(11.5px * var(--cts))}
.card .tile{background:var(--mc,var(--blush));color:var(--ink);border:1px solid var(--card-border)}
.el{background:var(--row);border:1.5px solid color-mix(in srgb,var(--line) 45%,transparent);font-size:calc(14.5px * var(--cts))}
.el.act{background:var(--row)}
.el.sel{background:var(--row-hot);border-color:var(--sel);border-width:2px}
.el.nolink{border:1.5px dashed var(--bad)}
.el .chev{opacity:1;color:var(--ink-2)}
.card.sel{outline:3px solid var(--sel);outline-offset:3px}
.card.sel:not(.decision)::after{content:"✓";position:absolute;top:-13px;right:-13px;width:26px;height:26px;border-radius:50%;background:var(--coral-fill);color:var(--on-fill);display:grid;place-items:center;font:800 15px/1 var(--font-body);box-shadow:0 0 0 2px var(--card);z-index:3}
.card.hot{box-shadow:0 0 0 4px var(--sel),var(--shadow)}
.port{border-color:var(--coral);width:15px;height:15px}
.port::after{inset:-15px}
.collapse-btn{border-color:var(--line);color:var(--ink)}
.wire .wbtn{opacity:1}
.card .nid{display:none}

/* Decision: diamond shape + label, not colour alone */
.card.decision::before{background:var(--fm-accent-fill);border:var(--card-bw) solid var(--card-border);border-radius:var(--r)}
.card.decision .hd,.card.decision .tile,.card.decision .ttl{color:var(--ink)}
.card.decision .kind{color:var(--ink-2);opacity:1}
.card.decision.sel::before{outline-color:var(--sel)}

/* Module areas: pale tint + written title. Colour is never the only grouping cue. */
.frame{background:var(--mc);border:var(--bw) solid color-mix(in srgb,var(--line) 55%,transparent);border-radius:var(--r-lg)}
.frame .fl{color:var(--ink);background:var(--mc);border:var(--card-bw) solid var(--card-border);border-bottom:0;border-radius:var(--r) var(--r) 0 0;padding:.25em .8em .2em;margin:0;bottom:100%}
.frame .fl small{color:var(--ink-2)}
.zl-1 .frame{border-width:3px}

/* Links: colour + dash pattern + symbol + label */
#edges .ln{stroke-width:3}
#edges .ln.sel,#edges .ln.hot{stroke-width:5.5}
:root[data-contrast="high"] #edges .ln{stroke-width:3.6}
.zl-1 #edges .ln{opacity:1}
#edges .ln.f-reference{stroke-linecap:round}
.elabel{display:inline-flex;align-items:center;gap:5px;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:var(--r-pill);padding:2px 9px 2px 6px;font-size:calc(13px * var(--cts))}
.elabel.dec{background:var(--card);color:var(--ink);border-color:var(--line)}
.elabel .g,.lg-row .g{width:15px;height:15px;flex:none;background:var(--lc);-webkit-mask:var(--gl) center/contain no-repeat;mask:var(--gl) center/contain no-repeat}
.elabel.badge{padding:3px;border-radius:50%}
.elabel.badge .g{width:14px;height:14px}
:root[data-link-labels="off"] .elabel .lt{display:none}
:root[data-link-labels="off"] .elabel:not(.badge){padding:3px;border-radius:50%}
.f-navigate{--gl:var(--g-nav);--lc:var(--e-nav)}
.f-function{--gl:var(--g-fn);--lc:var(--e-fn)}
.f-data{--gl:var(--g-data);--lc:var(--e-data)}
.f-condition{--gl:var(--g-cond);--lc:var(--e-cond)}
.f-error{--gl:var(--g-err);--lc:var(--e-err)}
.f-permission{--gl:var(--g-perm);--lc:var(--e-perm)}
.f-api{--gl:var(--g-api);--lc:var(--e-api)}
.f-reference{--gl:var(--g-ref);--lc:var(--e-ref)}

/* Link key + filter */
#lkey{position:absolute;left:16px;bottom:216px;z-index:16;width:min(260px,calc(100% - 32px));max-height:calc(100% - 290px);overflow:auto;background:var(--card);border:var(--card-bw) solid var(--card-border);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:10px}
#lkey[hidden]{display:none}
#lkey h3{font-size:1rem;margin:2px 4px 6px;display:flex;align-items:center;gap:6px}
#lkey h3 .btn{margin-left:auto}
.lg-row{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:4px 6px;border:0;background:none;border-radius:var(--r-sm);text-align:left;font-weight:600}
.lg-row:hover{background:var(--row)}
.lg-row svg{width:46px;height:14px;flex:none;overflow:visible}
.lg-row .nm{flex:1}
.lg-row .cb{width:20px;height:20px;border:2px solid var(--line);border-radius:var(--r-sm);display:grid;place-items:center;flex:none;font-weight:800;font-size:13px;line-height:1}
.lg-row[aria-pressed="true"] .cb{background:var(--coral-fill);border-color:var(--coral-fill);color:var(--on-fill)}
.lg-row[aria-pressed="false"] .nm{text-decoration:line-through;color:var(--ink-2)}
.lg-note{font-size:.8rem;color:var(--ink-2);margin:6px 4px 2px}

/* Density */
:root[data-density="compact"] .li{min-height:42px;padding:6px 10px}
:root[data-density="compact"] .field{margin:10px 0}
:root[data-density="compact"] .nav{min-height:40px}
:root[data-density="compact"] .topbar{padding:6px 12px}
:root[data-density="compact"] .card{padding:9px}
:root[data-density="compact"] .el{min-height:32px;padding:4px 9px;margin-top:4px}
:root[data-density="compact"] #panel{padding:14px 12px 90px}
:root[data-density="compact"] .ed-head{padding:12px 14px 8px}

/* ---------- Per-theme layout details ---------- */
/* Warm Canvas: editorial serif headings, tab-shaped module labels, soft shadows */
:root[data-fm-theme="warm-canvas"] .frame .fl{font-size:calc(17px * var(--fboost,1))}
:root[data-fm-theme="warm-canvas"] h1,:root[data-fm-theme="warm-canvas"] .proj-switch{letter-spacing:-.005em}
:root[data-fm-theme="warm-canvas"] .card{padding:14px}

/* Orbit System: precise console, accent outline, readable section labels */
:root[data-fm-theme="orbit-system"] .card:not(.decision){border-top:3px solid var(--coral)}
:root[data-fm-theme="orbit-system"] .frame{border-style:dashed;border-color:var(--line);border-width:1.5px}
:root[data-fm-theme="orbit-system"] .frame .fl{border-radius:var(--r-sm);border-bottom:var(--card-bw) solid var(--card-border);margin-bottom:6px;display:flex;align-items:center;gap:.4em}
:root[data-fm-theme="orbit-system"] .frame .fl::before{content:"";width:.6em;height:.6em;background:var(--coral);flex:none}
:root[data-fm-theme="orbit-system"] .overlay,:root[data-fm-theme="orbit-system"] #tray,:root[data-fm-theme="orbit-system"] #minimap{border-color:color-mix(in srgb,var(--coral) 55%,var(--line))}
:root[data-fm-theme="orbit-system"] .topbar{box-shadow:none;border-bottom:1.5px solid color-mix(in srgb,var(--coral) 45%,var(--line))}
:root[data-fm-theme="orbit-system"] .nav-label{font-family:var(--font-display)}

/* Bold Play: thick outlines, solid offset shadows, chunky buttons */
:root[data-fm-theme="bold-play"] .btn:not(.ghost){box-shadow:2px 2px 0 0 var(--ink)}
:root[data-fm-theme="bold-play"] .btn:not(.ghost):active{box-shadow:none;transform:translate(2px,2px)}
:root[data-fm-theme="bold-play"] .sa-btn{border:2px solid var(--ink);box-shadow:3px 3px 0 0 var(--ink)}
:root[data-fm-theme="bold-play"] .frame{border:0}
:root[data-fm-theme="bold-play"] .frame .fl{border-bottom:var(--card-bw) solid var(--card-border);border-radius:var(--r-pill);margin-bottom:8px;font-size:calc(17px * var(--fboost,1))}
:root[data-fm-theme="bold-play"] .elabel{border:2px solid var(--ink)}
:root[data-fm-theme="bold-play"] .overlay,:root[data-fm-theme="bold-play"] #tray,:root[data-fm-theme="bold-play"] #minimap,:root[data-fm-theme="bold-play"] .li,:root[data-fm-theme="bold-play"] .inp,:root[data-fm-theme="bold-play"] .search input{border:2px solid var(--ink)}
:root[data-fm-theme="bold-play"] .nav.on{box-shadow:2px 2px 0 0 var(--ink);border:2px solid var(--ink)}
:root[data-fm-theme="bold-play"] .card .ttl{font-weight:700}
:root[data-fm-theme="bold-play"] .tpart{border:2px solid var(--ink)}

/* Mono Studio: flat workbench, narrow rail, compact rectangles, node IDs */
:root[data-fm-theme="mono-studio"] .sidebar{width:196px;padding:10px 8px}
:root[data-fm-theme="mono-studio"] .nav{min-height:42px;font-weight:600}

  #tray.tray6.dock-left{left:6px}#tray.tray6.dock-right{right:6px;top:120px;max-height:calc(100% - 120px - 170px)}
  #tray.tray6.dock-left .tpart,#tray.tray6.dock-right .tpart{flex-direction:column;gap:2px;min-height:52px;width:62px;padding:6px 2px;font-size:.66rem;justify-content:center;text-align:center;white-space:normal;line-height:1.1}
  #tray.tray6.dock-left .tray-ctl .tl,#tray.tray6.dock-right .tray-ctl .tl{font-size:.66rem}
  #tray.tray6.dock-left .tray-fold,#tray.tray6.dock-right .tray-fold{flex-direction:column;gap:0;width:62px;padding:4px 2px}
}
/* ===== FM6 Smart Action images ===== */
.sa-att{margin-top:10px}
.sa-att-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sa-att-h .help{flex:1;min-width:180px;margin:0}
.sa-imgs{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.sa-img{display:grid;grid-template-columns:1fr auto;gap:4px;align-items:center;background:var(--row);border-radius:var(--r);padding:6px}
.sa-thumb{grid-column:1/-1;border:0;padding:0;background:var(--card);border-radius:calc(var(--r) - 2px);overflow:hidden;height:92px;cursor:zoom-in}
.sa-thumb img{width:100%;height:100%;object-fit:contain;display:block}
.sa-il{min-height:36px;font-size:.85rem;padding:4px 8px}
#sa-view{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:16px}
#sa-view[hidden]{display:none}
#sa-view figure{margin:0;max-width:min(96vw,1100px);max-height:92vh;display:flex;flex-direction:column;gap:8px}
#sa-view img{max-width:100%;max-height:80vh;object-fit:contain;border-radius:8px;background:#fff}
#sa-view figcaption{display:flex;gap:10px;align-items:center;color:#fff;font-size:.95rem}
#sa-view figcaption .btn{margin-left:auto}
/* ===== FM6 activity log ===== */
.obj-box{background:var(--row);border-radius:var(--r-lg);padding:10px 12px;margin-bottom:12px}
.obj-on,.obj-new{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.obj-on .inp,.obj-new .inp{flex:1;min-width:160px}
.obj-on .flabel{margin:0;width:100%}
.act-seg{margin-bottom:12px}
.act-seg button{flex:1}
.act-list,.act-list ol{list-style:none;margin:0;padding:0}
.act-grp{margin-bottom:12px}
.act-grp.has-obj{border-left:4px solid var(--coral);padding-left:10px}
.obj-h{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.obj-h .flabel{margin:0}
.obj-rn{flex:1;min-width:140px;min-height:36px;font-weight:700}
.act-i{padding:10px 0;border-bottom:1px solid var(--line);line-height:1.55}
.act-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.act-top time{font-size:.8rem;color:var(--ink-2);min-width:7.5em}
.act-top b{flex-basis:100%}
.act-ch{list-style:none;margin:6px 0 0;padding:0;font-size:.88rem}
.act-ch li{padding:2px 0}
.act-ch .opw{font-weight:700}
.act-ch .op-removed .opw,.act-ch .op-disconnected .opw{text-decoration:underline;text-decoration-style:dotted}
.act-ch small{color:var(--ink-2)}
.act-ch .more summary{cursor:pointer;color:var(--ink-2)}
.reason .why-ai,.reason p{margin:6px 0 0}
.reason .none{color:var(--ink-2);font-style:italic}
/* ===== FM6 screens: unfinished markers, free layout, layout editor ===== */
.scr.undesigned .scr-body{background:repeating-linear-gradient(135deg,transparent 0 14px,color-mix(in srgb,var(--ap-line) 60%,transparent) 14px 16px)}
.scr-todo{margin:auto;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;padding:18px;border:2px dashed var(--ap-line);border-radius:12px;background:var(--ap-bg);color:var(--ap-text)}
.scr-todo b{font-size:1.05em}.scr-todo span{opacity:.75;font-size:.85em}
.sp.unnamed{outline:2px dashed color-mix(in srgb,var(--ap-text) 45%,transparent);outline-offset:2px}
.sp.unnamed::after{content:"Needs a name";position:absolute;right:6px;top:-9px;font-size:9px;font-weight:700;background:var(--ap-bg);color:var(--ap-text);padding:0 4px;border-radius:4px;border:1px dashed currentColor;pointer-events:none}
.scr-body.free{position:relative;display:block;padding:0;flex:1}
.sp.fp{position:absolute;margin:0;box-sizing:border-box;overflow:hidden}
.lay-stage .sp.fp.lay-sel{overflow:visible}
.sp.fp.sp-tab{background:var(--ap-surface);border-bottom:3px solid var(--ap-line);border-radius:calc(var(--ap-r) * .4)}
.sp.fp.sp-tab.on{border-bottom-color:var(--ap)}
.sp.fp.sp-mi,.sp.fp.sp-link{display:flex;align-items:center;padding:0 12px}
.sp.fp.sp-mi{background:var(--ap-surface)}
.sp.fp.sp-btn,.sp.fp.sp-tab{display:flex;align-items:center;justify-content:center}
#lay{position:fixed;inset:0;z-index:900;background:var(--bg,var(--canvas));display:flex;flex-direction:column}
#lay[hidden]{display:none}
.lay-top{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1.5px solid var(--line);background:var(--bar,var(--card))}
.lay-title{font-family:var(--font-display);font-size:1.05rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lay-main{flex:1;min-height:0;display:flex}
.lay-stage{flex:1;min-width:0;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:12px;background:var(--canvas)}
.lay-fit{flex:none}
.lay-dev{transform-origin:0 0;width:max-content}
.lay-stage .sp{cursor:move;touch-action:none}
.lay-stage .sp-port,.lay-stage .sp-bad{display:none}
.lay-stage .sp.lay-sel{outline:3px solid var(--coral);outline-offset:2px;z-index:2}
.lay-stage .sp.lay-moving{opacity:.85;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.lay-stage .lh{position:absolute;width:calc(22px * var(--hs,1));height:calc(22px * var(--hs,1));background:var(--coral);border:2px solid #fff;border-radius:50%;z-index:3;touch-action:none}
.lay-stage .lh.se{right:2px;bottom:2px;cursor:nwse-resize}
.lay-stage .lh.e{right:2px;top:calc(50% - 9px);cursor:ew-resize}
.lay-stage .lh.s{bottom:2px;left:calc(50% - 9px);cursor:ns-resize}
.lay-ren{position:absolute;inset:0;width:100%;height:100%;min-height:0;z-index:4;font:inherit;text-align:center}
.lay-side{width:320px;flex:none;overflow:auto;padding:14px 16px;border-left:1.5px solid var(--line);background:var(--card)}
.lay-side h3{margin:0 0 8px;font-family:var(--font-display)}
.lay-parts{display:flex;flex-wrap:wrap;gap:6px}
.lay-parts .tpart{cursor:pointer}
.lay-btn{margin:0 0 10px}
@media (max-width:760px){.lay-main{flex-direction:column}.lay-side{width:auto;max-height:42vh;border-left:0;border-top:1.5px solid var(--line)}}
</style>
</head>

const SCHEMA=1;
function blankProject({name='My app',description='',platforms=['Android'],withHome=true}={}){
  const p={schema:SCHEMA,format:'flowmate-project',id:uid('prj'),name,description,platforms,createdAt:Date.now(),updatedAt:Date.now(),rev:0,
    roles:[{id:'role_guest',name:'Guest'},{id:'role_user',name:'Signed-in user'}],modules:{},entities:{},connections:{},startPageId:null};
  if(withHome){const m=addModule(p,'Main');const h=addEntity(p,'page',{name:'Home',pageType:'Home / dashboard',moduleId:m.id,x:0,y:0});p.startPageId=h.id;}
  return p;
}
function addModule(p,name,colour){const id=uid('mod');const n=Object.keys(p.modules).length;const m={id,name,colour:colour||MOD_COLOURS[n%MOD_COLOURS.length],order:n};p.modules[id]=m;return m}
function addEntity(p,kind,props={}){
  const id=props.id||uid(kind.slice(0,3));
  const e=Object.assign({id,kind,name:KINDS[kind].label,desc:'',status:'New',moduleId:null,parentId:null,x:0,y:0,collapsed:false,view:'structure',roles:[],notes:''},
    kind==='page'?{pageType:'Custom',elements:[]}:{},
    kind==='function'?{trigger:'',steps:'',success:'',error:''}:{},
    kind==='setting'?{key:'',valueType:'On / off',defaultValue:'On',scope:'Whole app'}:{},
    kind==='data'?{fields:''}:{},
    props,{id,kind});
  p.entities[id]=e;return e;
}
function addElement(p,pageId,props={}){const pg=p.entities[pageId];if(!pg||pg.kind!=='page')throw new Error('Not a page');const el=Object.assign({id:uid('el'),label:'New button',type:'button'},props);pg.elements.push(el);return el}
function addConn(p,from,to,type,label=''){
  if(!p.entities[from.entity]||!p.entities[to])throw new Error('Missing end');
  const c={id:uid('con'),from:{entity:from.entity,element:from.element||null},to,type:type||defaultType(p,from.entity,to),label,condition:''};
  p.connections[c.id]=c;return c;
}
function defaultType(p,fromId,toId){
  const a=p.entities[fromId],b=p.entities[toId];if(!b)return 'navigate';
  if(b.kind==='page')return a&&a.kind!=='page'?'navigate':(/modal|sheet/i.test(b.pageType)?'modal':'navigate');
  if(b.kind==='function')return 'trigger';
  if(b.kind==='decision')return a&&a.kind==='decision'?'condition':'trigger';
  if(b.kind==='setting')return a&&a.kind==='page'?'setting':'reference';
  if(b.kind==='data')return a&&a.kind==='function'?'write':'read';
  return 'reference';
}
function outConns(p,id,elId){return Object.values(p.connections).filter(c=>c.from.entity===id&&(elId===undefined||(c.from.element||null)===(elId||null)))}
function inConns(p,id){return Object.values(p.connections).filter(c=>c.to===id)}
function removeConnsWhere(p,fn){for(const c of Object.values(p.connections))if(fn(c))delete p.connections[c.id]}
function removeEntity(p,id){
  const e=p.entities[id];if(!e)return;
  removeConnsWhere(p,c=>c.from.entity===id||c.to===id);
  for(const o of Object.values(p.entities))if(o.parentId===id)o.parentId=e.parentId||null;
  if(p.startPageId===id)p.startPageId=null;
  delete p.entities[id];
}
function removeElement(p,pageId,elId){const pg=p.entities[pageId];pg.elements=pg.elements.filter(x=>x.id!==elId);removeConnsWhere(p,c=>c.from.entity===pageId&&c.from.element===elId)}
function findElement(p,pageId,elId){const pg=p.entities[pageId];return pg&&pg.elements?pg.elements.find(x=>x.id===elId):null}
function descendants(p,id){const kids={};for(const e of Object.values(p.entities))if(e.parentId)(kids[e.parentId]=kids[e.parentId]||[]).push(e.id);const out=new Set();const st=[...(kids[id]||[])];while(st.length){const k=st.pop();if(out.has(k)||k===id)continue;out.add(k);st.push(...(kids[k]||[]))}return out}
function entityLabel(p,id){const e=p.entities[id];return e?e.name:'(missing)'}
function connFromLabel(p,c){const e=p.entities[c.from.entity];if(!e)return '(missing)';if(c.from.element){const el=findElement(p,e.id,c.from.element);return e.name+' › '+(el?el.label:'(missing button)')}return e.name}

/* Branch a new page (or other card) from a button or card. Creates the entity + a typed connection. */
function branchNew(p,from,kind,props={}){
  const src=p.entities[from.entity];
  const el=from.element?findElement(p,src.id,from.element):null;
  const name=props.name||(el?el.label:(kind==='page'?'New page':KINDS[kind].label));
  const e=addEntity(p,kind,Object.assign({name,moduleId:src.moduleId,parentId:src.id,x:src.x+380,y:src.y+(el?src.elements.indexOf(el)*46:0)},kind==='page'?{pageType:'Custom'}:{},props));
  nudgeFree(p,e);
  if(src.sx!=null&&kind==='page'&&typeof DEVICES!=='undefined'){e.sx=src.sx+(DEVICES[S.prefs.device]||DEVICES.phone).w+220;e.sy=src.sy+(el?src.elements.indexOf(el)*70:0)}
  const c=addConn(p,from,e.id);
  return {entity:e,conn:c};
}
function estSize(e){if(e.kind==='decision')return{w:190,h:190};return{w:268,h:e.kind==='page'?(e.view==='screen'?200:104+46*(e.elements||[]).length):130}}
function nudgeFree(p,e){
  const box=x=>{const s=estSize(x);return{x:x.x,y:x.y,w:s.w,h:s.h}};
  let tries=0;const hit=()=>Object.values(p.entities).some(o=>{if(o.id===e.id)return false;const a=box(e),b=box(o);return a.x<b.x+b.w+20&&a.x+a.w+20>b.x&&a.y<b.y+b.h+20&&a.y+a.h+20>b.y});
  while(hit()&&tries++<60)e.y+=60;
}

/* Checks: problems and things worth a look. Never fixes anything by itself. */
function checkProject(p){
  const iss=[];const add=(sev,msg,ref,fix)=>iss.push({sev,msg,ref,fix});
  const hasIn={};for(const c of Object.values(p.connections))hasIn[c.to]=true;
  for(const c of Object.values(p.connections)){
    if(!p.entities[c.from.entity]||!p.entities[c.to])add('problem','A link points to something that no longer exists.',{t:'conn',id:c.id},'remove-conn');
    else if(c.from.element&&!findElement(p,c.from.entity,c.from.element))add('problem','A link starts from a button that was removed.',{t:'conn',id:c.id},'remove-conn');
  }
  for(const e of Object.values(p.entities)){
    if(e.kind==='page'){
      for(const el of e.elements){if(EL_TYPES[el.type]?.act&&!outConns(p,e.id,el.id).length)add('problem',`“${el.label}” on ${e.name} doesn't do anything yet.`,{t:'element',id:e.id,el:el.id},'link-el')}
      if(!hasIn[e.id]&&p.startPageId!==e.id)add('problem',`Nobody can reach “${e.name}”. No button or link opens it.`,{t:'entity',id:e.id})
      if(!outConns(p,e.id).length&&!/modal|sheet/i.test(e.pageType))add('check',`“${e.name}” has no way out. Add a back or home button?`,{t:'entity',id:e.id})
    }
    if(e.kind==='function'&&!hasIn[e.id])add('check',`Nothing runs the function “${e.name}”.`,{t:'entity',id:e.id})
    if(e.kind==='function'&&!(e.steps||'').trim())add('check',`“${e.name}” has no steps written yet.`,{t:'entity',id:e.id})
    if(e.kind==='decision'&&outConns(p,e.id).filter(c=>c.type!=='reference').length<2)add('problem',`Decision “${e.name}” needs at least two answers (like Yes and No).`,{t:'entity',id:e.id})
    if(e.kind==='setting'&&!hasIn[e.id]&&!outConns(p,e.id).length)add('check',`Setting “${e.key||e.name}” isn't used anywhere.`,{t:'entity',id:e.id})
    if(e.parentId&&!p.entities[e.parentId])add('check',`“${e.name}” belongs to a branch that was deleted.`,{t:'entity',id:e.id})
  }
  if(!p.startPageId||!p.entities[p.startPageId])add('check','No start page is set. Pick one in App details.',null);
  return iss;
}

/* Trace: follow links forwards (what happens next) or backwards (what leads here). */
function trace(p,start,dir='fwd'){
  const ents=new Set(),conns=new Set(),order=[];const q=[];
  if(dir==='fwd'){
    const first=start.el?outConns(p,start.id,start.el):outConns(p,start.id);
    ents.add(start.id);order.push(start.el?connFromLabel(p,{from:{entity:start.id,element:start.el}}):entityLabel(p,start.id));
    for(const c of first){conns.add(c.id);if(!ents.has(c.to)){ents.add(c.to);order.push(entityLabel(p,c.to));q.push(c.to)}}
    while(q.length){const id=q.shift();const e=p.entities[id];if(!e)continue;
      for(const c of outConns(p,id)){if(e.kind==='page'&&c.from.element&&!start.deep)continue;conns.add(c.id);if(!ents.has(c.to)&&p.entities[c.to]){ents.add(c.to);order.push(entityLabel(p,c.to));q.push(c.to)}}}
  }else{
    ents.add(start.id);order.push(entityLabel(p,start.id));q.push(start.id);
    while(q.length){const id=q.shift();for(const c of inConns(p,id)){conns.add(c.id);const s=c.from.entity;if(!ents.has(s)&&p.entities[s]){ents.add(s);order.push(connFromLabel(p,c));if(p.entities[s].kind!=='page')q.push(s)}}}
  }
  return {ents,conns,order,dir,start};
}

// ---------- Exports ----------
function exportJSON(p){const o=clone(p);o.format='flowmate-project';o.schema=SCHEMA;o.exportedAt=new Date().toISOString();return JSON.stringify(o,null,2)}
function importJSON(text){
  let o;try{o=JSON.parse(text)}catch(e){throw new Error("This file isn't valid JSON.")}
  if(!o||typeof o!=='object'||!o.entities||!o.connections)throw new Error("This doesn't look like a FlowMate project file.");
  if((o.schema||1)>SCHEMA)throw new Error('This project was made with a newer FlowMate.');
  o.schema=SCHEMA;o.modules=o.modules||{};o.roles=o.roles||[];o.name=o.name||'Imported project';
  for(const e of Object.values(o.entities)){if(!KINDS[e.kind])throw new Error(`Unknown card type “${e.kind}”.`);if(e.kind==='page')e.elements=e.elements||[];e.x=+e.x||0;e.y=+e.y||0}
  delete o.exportedAt;return o;
}
function toMermaid(p){
  const id=s=>s.replace(/[^A-Za-z0-9_]/g,'_');const q=s=>String(s).replace(/"/g,"'");
  const shape={page:['["','"]'],function:['("','")'],decision:['{"','"}'],setting:['[["','"]]'],data:['[("','")]'],component:['[/"','"/]']};
  let out='flowchart LR\n';
  const byMod={};for(const e of Object.values(p.entities))(byMod[e.moduleId||'none']=byMod[e.moduleId||'none']||[]).push(e);
  for(const[m,list] of Object.entries(byMod)){const mod=p.modules[m];if(mod)out+=`  subgraph ${id(m)}["${q(mod.name)}"]\n`;for(const e of list){const[a,b]=shape[e.kind];out+=`    ${id(e.id)}${a}${q(e.name)}${b}\n`}if(mod)out+='  end\n'}
  for(const c of Object.values(p.connections)){if(!p.entities[c.from.entity]||!p.entities[c.to])continue;const el=c.from.element?findElement(p,c.from.entity,c.from.element):null;const lab=[el&&el.label,c.label].filter(Boolean).join(': ');const arrow=c.type==='reference'||c.type==='read'?'-.->':'-->';out+=`  ${id(c.from.entity)} ${arrow}${lab?`|"${q(lab)}"|`:''} ${id(c.to)}\n`}
  return out;
}
function toCSV(p){
  const cell=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=[['ID','Kind','Name','Module','Status','Type','On page','Goes to','Link type']];
  for(const e of Object.values(p.entities)){
    const mod=p.modules[e.moduleId]?.name||'';
    rows.push([e.id,KINDS[e.kind].label,e.name,mod,e.status,e.pageType||e.valueType||'', '', outConns(p,e.id).filter(c=>!c.from.element).map(c=>entityLabel(p,c.to)).join('; '),'']);
    if(e.kind==='page')for(const el of e.elements){const cs=outConns(p,e.id,el.id);rows.push([el.id,'Element',el.label,mod,'',EL_TYPES[el.type]?.label||el.type,e.name,cs.map(c=>entityLabel(p,c.to)).join('; '),cs.map(c=>CONN[c.type]?.label).join('; ')])}
  }
  return rows.map(r=>r.map(cell).join(',')).join('\n');
}

const Cloud={db:null,uid:null,state:'device',timers:{},writing:{},pending:{}};
function setSync(st){Cloud.state=st;renderSync()}
async function initCloud(){
  if(!window.claude||typeof window.claude.use!=='function'){setSync(Store.ok?'device':'memory');return}
  try{
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user){setSync(Store.ok?'device':'memory');return}
    const id=await user.id();if(!id){setSync('device');return}
    Cloud.db=db;Cloud.uid=id;setSync('busy');
    const col=db.collection('data/users/'+id);
    const snap=await Promise.race([col.get(),new Promise((_,r)=>setTimeout(()=>r({code:'timeout'}),10000))]);
    const cloudAt={};let changed=false;
    for(const d of snap.docs){
      if(!d.id.startsWith('proj-'))continue;const b=d.data();if(!b||!b.json)continue;
      let p;try{p=JSON.parse(b.json)}catch(e){continue}
      cloudAt[p.id]=p.updatedAt||0;
      const local=S.projects[p.id];
      if(!local||(p.updatedAt||0)>(local.updatedAt||0)){S.projects[p.id]=p;saveLocal(p);changed=true;if(S.p&&S.p.id===p.id){S.p=p;S.undo=[];S.redo=[]}}
    }
    for(const p of Object.values(S.projects))if((p.updatedAt||0)>(cloudAt[p.id]||0))queueCloud(p);
    setSync('ok');
    if(changed){if(S.p)renderAll();if(!$('#home').classList.contains('hide'))renderHome()}
  }catch(e){setSync('err')}
}
function queueCloud(p){if(!Cloud.db)return;clearTimeout(Cloud.timers[p.id]);Cloud.timers[p.id]=setTimeout(()=>pushCloud(p.id),1500)}
async function pushCloud(id,retry){
  if(Cloud.writing[id]){Cloud.pending[id]=true;return}
  const p=S.projects[id];if(!p||!Cloud.db)return;
  const json=JSON.stringify(p);if(json.length>240000){setSync('big');return}
  Cloud.writing[id]=true;setSync('busy');
  try{await Cloud.db.collection('data/users/'+Cloud.uid).doc('proj-'+id).set({name:p.name,updatedAt:p.updatedAt,json});setSync('ok')}
  catch(e){if(e&&e.code==='unavailable'&&!retry){Cloud.writing[id]=false;setTimeout(()=>pushCloud(id,true),800+Math.random()*800);return}setSync(e&&e.code==='quota_exceeded'?'full':'err')}
  finally{Cloud.writing[id]=false;if(Cloud.pending[id]){Cloud.pending[id]=false;pushCloud(id)}}
}
async function deleteCloud(id){if(!Cloud.db)return;try{await Cloud.db.collection('data/users/'+Cloud.uid).doc('proj-'+id).delete()}catch(e){}}

function commit(label,fn){
  const before=JSON.stringify(S.p);
  let r;try{r=fn(S.p)}catch(e){S.p=JSON.parse(before);S.projects[S.p.id]=S.p;toast(e.message||'That change could not be made.');return}
  pushUndo(label,before);touch();renderAll();return r;
}
function pushUndo(label,before){S.undo.push({label,json:before,at:Date.now()});if(S.undo.length>100)S.undo.shift();S.redo=[]}
function touch(){S.p.updatedAt=Date.now();S.p.rev=(S.p.rev||0)+1;S.projects[S.p.id]=S.p;saveLocal(S.p);queueCloud(S.p);renderSync()}
function restore(json){S.p=JSON.parse(json);S.projects[S.p.id]=S.p;validateSel();touch();renderAll()}
function undo(){const h=S.undo.pop();if(!h)return toast('Nothing to undo');S.redo.push({label:h.label,json:JSON.stringify(S.p)});restore(h.json);toast('Undid: '+h.label)}
function redo(){const h=S.redo.pop();if(!h)return toast('Nothing to redo');S.undo.push({label:h.label,json:JSON.stringify(S.p)});restore(h.json);toast('Redid: '+h.label)}

async function download(filename,data){
  if(!/\.(gif|png|jpe?g|webp|mp4|webm|txt|json|md|docx|pptx|epub|csv|ttf|html|svg|pdf|xlsx|zip)$/i.test(filename))filename+='.txt';

  try{const a=document.createElement('a');a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type:'text/plain'}));a.download=filename;document.body.appendChild(a);a.click();a.remove();toast('Downloading '+filename)}catch(e){toast("Downloads aren't allowed here. Use Copy instead.")}

let DROP=null;

  const m=$('#dropMenu');DROP={from,at};

// ---------- Search ----------
function searchItems(q){
  const p=S.p;q=q.trim().toLowerCase();if(!q||!p)return[];const res=[];
  for(const e of Object.values(p.entities)){
    const hay=[e.name,e.desc,e.key,e.notes,e.fields,e.steps,e.status,e.pageType,p.modules[e.moduleId]?.name].join(' ').toLowerCase();
    if(hay.includes(q))res.push({ref:{t:'entity',id:e.id},title:e.name,sub:KINDS[e.kind].label+(p.modules[e.moduleId]?' · '+p.modules[e.moduleId].name:''),ic:KINDS[e.kind].icon});
    if(e.elements)for(const el of e.elements)if(el.label.toLowerCase().includes(q))res.push({ref:{t:'element',id:e.id,el:el.id,scroll:true},title:el.label,sub:(EL_TYPES[el.type]?.label||'')+' on '+e.name,ic:EL_TYPES[el.type]?.icon||'section'});
  }
  if(/(do ?n.?t do|nothing|unlinked|no link|not connected|broken)/.test(q))for(const i of checkProject(p))if(i.ref&&i.ref.t!=='conn')res.unshift({ref:i.ref,title:i.msg,sub:'From Check',ic:'alert'});
  return res.slice(0,40);
}
function renderSearchResults(box,q){
  const res=searchItems(q);box._res=res;
  box.innerHTML=res.length?res.map((r,i)=>`<button data-i="${i}">${icon(r.ic)}<span>${esc(r.title)}<small>${esc(r.sub)}</small></span></button>`).join(''):`<p class="help" style="padding:10px">Nothing matches “${esc(q)}”. Try a page name, button label or setting key. Try “nothing” to find buttons that don't do anything.</p>`;
  box.hidden=!q.trim();
}

$('#q').addEventListener('keydown',ev=>{if(ev.key==='Enter'){const r=$('#qres')._res;r&&r[0]&&goResult(r[0])}if(ev.key==='Escape'){ev.target.value='';$('#qres').hidden=true;ev.target.blur()}});
$('#qres').addEventListener('click',ev=>{const b=ev.target.closest('button[data-i]');if(b)goResult($('#qres')._res[+b.dataset.i])});

// POINTER — pan, pinch, drag cards, draw links
// =========================================================
const ptrs=new Map();let G=null;
vp.addEventListener('pointerdown',ev=>{
  const trayPart=ev.target.closest('[data-part]');
  if(trayPart){vp.setPointerCapture?.(ev.pointerId);ptrs.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});G={type:'tray',part:trayPart.dataset.part,sx:ev.clientX,sy:ev.clientY,moved:false};return}
  if(ev.target.closest('#tray'))return;
  if(ev.target.closest('.overlay,#minimap,#panel,#dropMenu,.crumbs,#traceBar,.empty-hint div,.fab,.collapse-btn,#lkey,#ovwarn,.tray-ctl'))return;
  vp.setPointerCapture?.(ev.pointerId);
  ptrs.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(ptrs.size===2){const[a,b]=[...ptrs.values()];G={type:'pinch',d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2,z:S.view.z};return}
  hideDropMenu();
  const port=ev.target.closest('[data-port]');
  if(port){G={type:'link',from:{entity:port.dataset.ent,element:port.dataset.port==='el'?port.dataset.el:null},sx:ev.clientX,sy:ev.clientY,moved:false};return}
  const hit=ev.target.closest('[data-conn]');
  if(hit){G={type:'tapconn',id:hit.dataset.conn,sx:ev.clientX,sy:ev.clientY};return}
  const card=ev.target.closest('.card');
  if(card){
    const id=card.dataset.id;const e=S.p.entities[id];const elRow=ev.target.closest('[data-el]');
    const canDrag=ev.pointerType!=='touch'||(S.sel&&S.sel.id===id);
    if(canDrag&&elRow&&card.classList.contains('scard')){G={type:'part',id,el:elRow.dataset.el,sx:ev.clientX,sy:ev.clientY,vx:S.view.x,vy:S.view.y,moved:false};return}
    G={type:canDrag?'drag':'pan-or-tap',id,el:elRow?elRow.dataset.el:null,sx:ev.clientX,sy:ev.clientY,ox:PX(e),oy:PY(e),vx:S.view.x,vy:S.view.y,moved:false,before:null};
    return;
  }
  G={type:'pan',sx:ev.clientX,sy:ev.clientY,vx:S.view.x,vy:S.view.y,moved:false};
});
vp.addEventListener('pointermove',ev=>{
  if(!ptrs.has(ev.pointerId)||!G)return;ptrs.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(G.type==='pinch'&&ptrs.size>=2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const r=vp.getBoundingClientRect();const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;S.view.x+=mx-G.mx;S.view.y+=my-G.my;G.mx=mx;G.my=my;zoomAt(mx-r.left,my-r.top,G.z*d/G.d);return}
  const dx=ev.clientX-G.sx,dy=ev.clientY-G.sy;if(!G.moved&&Math.hypot(dx,dy)<5)return;if(!G.moved&&G.before===null)G.before=JSON.stringify(S.p);G.moved=true;
  if(G.type==='pan'||G.type==='pan-or-tap'){S.view.x=G.vx+dx;S.view.y=G.vy+dy;applyView()}
  else if(G.type==='drag'){
    const e=S.p.entities[G.id];const nx=Math.round(G.ox+dx/S.view.z),ny=Math.round(G.oy+dy/S.view.z);setPos(e,nx,ny);
    const g=S.geo[G.id];if(g){g.x=nx;g.y=ny;g.node.style.left=nx+'px';g.node.style.top=ny+'px';g.node.classList.add('dragging')}
    if(!G.raf)G.raf=requestAnimationFrame(()=>{if(G)G.raf=0;const{vis}=visibleSet(S.p);withIX(()=>{renderFrames(vis);renderEdges(vis)})});
  }
  else if(G.type==='tray'||G.type==='part'){dragMove(G,ev)}

var AI={sample:null,dict:null,ready:false,ctl:null,turns:[],state:'ask',text:'',scope:'app',res:null,chosen:-1,err:'',progress:0,listening:false,partial:''};

async function initAI(){
  if(!window.claude||typeof window.claude.use!=='function'){AI.ready=true;return}
  try{
    const [s,d]=await Promise.all([window.claude.use('sample'),window.claude.use('dictation')]);
    AI.sample=s;AI.dict=d;
    if(d){
      d.onFinal(({text})=>{AI.text=AI.text?AI.text+text:text.replace(/^\s+/,'');const t=$('#sa-in');if(t)t.value=AI.text;AI.partial='';const pv=$('#sa-partial');if(pv)pv.textContent=''});
      d.onPartial(({text})=>{AI.partial=text;const pv=$('#sa-partial');if(pv)pv.textContent=text});
      d.onState(({state,reason})=>{AI.listening=state!=='idle';const m=$('#sa-mic');if(m){m.classList.toggle('on',AI.listening);m.setAttribute('aria-pressed',AI.listening);m.setAttribute('aria-label',AI.listening?'Stop listening':'Talk instead of typing')}
        if(state==='idle'&&reason){if(reason==='unavailable'||reason==='not_granted'){AI.dict=null;if(m)m.remove()}else if(['rate_limited','upstream_error','time_limit'].includes(reason))toast(reason==='time_limit'?'Stopped listening after an hour':'The microphone stopped. Tap it to try again.')}});
    }

}

const AI_ERR={not_granted:'FlowMate isn\'t allowed to use Claude. You can still edit everything by hand.',sampling_disabled:'Claude isn\'t available on this account right now. You can still edit by hand.',not_declared:'Smart Action is switched off for this page.',capability_disabled:'Smart Action isn\'t available here.',capability_removed:'Smart Action needs a newer Claude app.',rate_limited:'Too many requests just now. Wait a minute and try again.',session_expired:'You\'ve been signed out of Claude. Sign in again, then retry.',refused:'Claude couldn\'t help with that request. Try wording it differently.',empty_completion:'Claude didn\'t send anything back. Try asking for less at once.',invalid_json:'The answer came back in the wrong shape. Tap Try again.',prompt_too_large:'This project is too big to send in one go. Pick "This card" or "Its module" as the scope.',upstream_error:'Couldn\'t reach Claude. Check your connection and try again.'};

// ---------- What the AI sees ----------
function projectSnapshot(p,scope,selId){
  const q=s=>'"'+String(s??'').replace(/"/g,"'").replace(/\s*\n\s*/g,' | ')+'"';
  let ents=Object.values(p.entities);
  if(scope!=='app'&&selId&&p.entities[selId]){
    const keep=new Set([selId]);const sel=p.entities[selId];
    if(scope==='module'&&sel.moduleId)for(const e of ents)if(e.moduleId===sel.moduleId)keep.add(e.id);
    for(const c of Object.values(p.connections)){if(keep.has(c.from.entity))keep.add(c.to);if(keep.has(c.to))keep.add(c.from.entity)}
    ents=ents.filter(e=>keep.has(e.id));
  }
  const L=[`APP NAME: ${p.name}`];
  if(p.description)L.push('WHAT THE APP IS FOR: '+p.description);
  if(p.platforms&&p.platforms.length)L.push('PLATFORMS: '+p.platforms.join(', '));
  L.push('ROLES: '+(p.roles.map(r=>`${r.id}=${q(r.name)}`).join(', ')||'none'));
  L.push('MODULES: '+(Object.values(p.modules).sort((a,b)=>a.order-b.order).map(m=>`${m.id}=${q(m.name)}`).join(', ')||'none'));
  L.push('START PAGE: '+(p.startPageId||'none'));
  if(ents.length<Object.keys(p.entities).length)L.push(`(Showing ${ents.length} of ${Object.keys(p.entities).length} cards: the chosen scope and anything linked to it.)`);
  L.push('CARDS:');
  for(const e of ents){
    let s=`[${e.kind} ${e.id}] ${q(e.name)} module=${e.moduleId||'none'} status=${q(e.status)}`;
    if(e.kind==='page')s+=` pageType=${q(e.pageType)}`+(e.roles.length?` roles=${e.roles.join(',')}`:'');
    if(e.kind==='function')s+=` trigger=${q(e.trigger)} steps=${q(e.steps)}`+(e.success?` success=${q(e.success)}`:'')+(e.error?` error=${q(e.error)}`:'');
    if(e.kind==='setting')s+=` key=${e.key||'none'} valueType=${q(e.valueType)} default=${q(e.defaultValue)} scope=${q(e.scope)}`;
    if(e.kind==='data')s+=` fields=${q(e.fields)}`;
    if(e.desc)s+=` desc=${q(e.desc)}`;
    if(e.notes)s+=` notes=${q(e.notes)}`;
    L.push(s);
    if(e.kind==='page')for(const el of e.elements){const cs=outConns(p,e.id,el.id);L.push(`   element ${el.id} ${el.type} ${q(el.label)} -> `+(cs.length?cs.map(c=>`${c.to} (${c.type}${c.label?' '+q(c.label):''}, link ${c.id})`).join('; '):'nothing yet'))}
  }
  const ids=new Set(ents.map(e=>e.id));
  const cl=Object.values(p.connections).filter(c=>!c.from.element&&(ids.has(c.from.entity)||ids.has(c.to)));
  if(cl.length){L.push('CARD-TO-CARD LINKS:');for(const c of cl)L.push(`   ${c.from.entity} -> ${c.to} (${c.type}${c.label?' '+q(c.label):''}, link ${c.id})`)}
  return L.join('\n');
}
function buildPrompt(p,request,scope,sel,turns){
  const selTxt=!sel?'Nothing is selected.':sel.t==='conn'?`A link (${sel.id}) is selected.`:(()=>{const e=p.entities[sel.id];if(!e)return 'Nothing is selected.';let t=`The ${e.kind} card ${e.id} "${e.name}" is selected.`;if(sel.t==='element'){const el=findElement(p,e.id,sel.el);if(el)t+=` Inside it, the ${el.type} ${el.id} "${el.label}" is selected.`}return t})();

  return `You are the planning assistant inside FlowMate, a visual tool for designing apps. A map is made of cards (pages, functions, decisions, settings, data, components), the buttons and parts on each page, and typed links between them. You only PROPOSE changes. The user reviews every change and confirms before anything happens.

THE SAVED MAP RIGHT NOW. This is the only source of truth. Never assume something exists unless it is listed here.

${projectSnapshot(p,scope,sel&&sel.id)}

"""${request}"""

Before proposing anything, check what already exists so you reuse pages, functions, settings and data instead of making duplicates. If the request's scope is unclear and it changes the outcome (for example one page vs the whole app), make the options cover the different scopes.

Reply with ONLY one JSON object, no other text:
{"understood":"one short plain-English sentence saying what you think they want",
 "answer":"if they asked a question, a short plain-English answer; otherwise an empty string",
 "options":[{"title":"short, e.g. Create a new page","why":"one sentence: what this option does and its trade-off","ops":[ ... ]}]}

Give 1 to 3 genuinely different options (for example: a new page, or extend an existing page, or a reusable function). If they only asked a question, "options" may be an empty list.

"ops" are steps that run in order. Allowed steps:
{"op":"addModule","ref":"m1","name":"..."}
{"op":"addRole","ref":"r1","name":"..."}
{"op":"addCard","ref":"c1","kind":"page|function|decision|setting|data|component","name":"...","module":"<module id or ref>","desc":"...","pageType":"${PAGE_TYPES.join('|')}","roles":["<role id or ref>"],"trigger":"...","steps":["..."],"success":"...","error":"...","key":"camelCaseKey","valueType":"On / off|Text|Number|Choice","defaultValue":"...","scope":"Whole app|One module|One page|One component","fields":["name: type"]}
{"op":"addElement","ref":"e1","card":"<page id or ref>","label":"...","type":"${Object.keys(EL_TYPES).join('|')}"}
{"op":"link","from":"<card id or ref>","element":"<element id or ref, only when the link starts from a button or part>","to":"<card id or ref>","type":"${Object.keys(CONN).join('|')}","label":"optional short label such as Yes, No, Success, Failed"}

{"op":"updateElement","card":"<existing page id>","element":"<existing element id>","set":{"label":"...","type":"..."}}
{"op":"removeLink","id":"<existing link id>"}

Rules:

- Things only one person should see: give them a role, or put "Only visible to me" in desc.
- Only remove things if the user asked for that.
- Keep names short, in plain English, with Australian spelling. New things get no status (they default to New).

- When asked to plan a whole app from its description, give ONE thorough option with modules, pages, their buttons, functions, decisions, settings, data and all the links (up to about 45 cards).`;

// ---------- Check + apply steps ----------
function runOps(p,ops){
  const R={},lines=[],created=[];
  const str=(v,d='')=>{v=v==null?'':String(v).trim();return v||d};
  const arr=v=>Array.isArray(v)?v.map(x=>String(x)).join('\n'):str(v);
  const rid=x=>x==null?null:(R[x]!==undefined?R[x]:x);
  const ent=x=>{const i=rid(x);return i&&p.entities[i]?i:null};
  const nm=i=>`“${p.entities[i].name}”`;
  const line=(t,text)=>lines.push({t,text});
  const FIELDS={all:['name','desc','status','notes'],page:['pageType','roles'],function:['trigger','steps','success','error'],setting:['key','valueType','defaultValue','scope'],data:['fields'],decision:[],component:[]};
  const setField=(e,k,v)=>{
    if(!FIELDS.all.includes(k)&&!(FIELDS[e.kind]||[]).includes(k))throw new Error(`${KINDS[e.kind].label}s don't have “${k}”`);
    if(k==='status'){if(!STATUSES.includes(v))throw new Error(`“${v}” isn't a status`)}
    if(k==='pageType'&&!PAGE_TYPES.includes(v))v='Custom';
    if(k==='roles'){v=(Array.isArray(v)?v:[v]).map(rid).filter(r=>p.roles.some(x=>x.id===r));e.roles=v;return}
    if(k==='steps'||k==='fields'){e[k]=arr(v);return}
    if(k==='name'){v=str(v);if(!v)throw new Error('A name can\'t be blank')}
    e[k]=k==='defaultValue'?String(v??''):str(v);
  };
  for(const o of Array.isArray(ops)?ops:[]){
    try{
      if(!o||typeof o!=='object')throw new Error('A step was unreadable');
      switch(o.op){
        case 'addModule':{const n=str(o.name,'New module');const ex=Object.values(p.modules).find(m=>m.name.toLowerCase()===n.toLowerCase());if(ex){R[o.ref]=ex.id;line('same',`Uses the existing module “${ex.name}”`);break}const m=addModule(p,n);R[o.ref]=m.id;line('add',`New module “${n}”`);break}
        case 'addRole':{const n=str(o.name,'New role');const ex=p.roles.find(r=>r.name.toLowerCase()===n.toLowerCase());if(ex){R[o.ref]=ex.id;line('same',`Uses the existing role “${ex.name}”`);break}const r={id:uid('role'),name:n};p.roles.push(r);R[o.ref]=r.id;line('add',`New user role “${n}”`);break}
        case 'addCard':{
          if(!KINDS[o.kind])throw new Error(`“${o.kind}” isn't a kind of card`);
          const n=str(o.name);if(!n)throw new Error('A new card had no name');
          const dup=Object.values(p.entities).find(e=>e.kind===o.kind&&e.name.toLowerCase()===n.toLowerCase());
          if(dup){R[o.ref]=dup.id;line('same',`Reuses the existing ${KINDS[o.kind].label.toLowerCase()} ${nm(dup.id)}`);break}
          const mod=o.module&&p.modules[rid(o.module)]?rid(o.module):null;
          const e=addEntity(p,o.kind,{name:n,moduleId:mod,status:'New',desc:str(o.desc)});
          for(const k of [...FIELDS[o.kind]].filter(k=>o[k]!=null))try{setField(e,k,o[k])}catch(err){}
          if(o.kind==='page'&&!p.startPageId)p.startPageId=e.id;
          R[o.ref]=e.id;created.push(e.id);
          line('add',`New ${KINDS[o.kind].label.toLowerCase()} “${n}”${mod?' in '+p.modules[mod].name:''}`);break}
        case 'addElement':{
          const pg=ent(o.card);if(!pg||p.entities[pg].kind!=='page')throw new Error(`couldn't find the page for “${str(o.label,'a button')}”`);
          const lab=str(o.label,'New button');const ex=p.entities[pg].elements.find(x=>x.label.toLowerCase()===lab.toLowerCase());
          if(ex){R[o.ref]=ex.id;line('same',`“${lab}” is already on ${nm(pg)}`);break}
          const type=EL_TYPES[o.type]?o.type:'button';const el=addElement(p,pg,{label:lab,type});R[o.ref]=el.id;
          line('add',`New ${EL_TYPES[type].label.toLowerCase()} “${lab}” on ${nm(pg)}`);break}
        case 'link':{
          const f=ent(o.from),t=ent(o.to);if(!f||!t)throw new Error('a link pointed to something that doesn\'t exist');
          if(f===t)throw new Error('a card can\'t link to itself');
          let el=null;if(o.element){el=rid(o.element);if(!findElement(p,f,el))throw new Error(`couldn't find that button on ${nm(f)}`)}
          const type=CONN[o.type]?o.type:defaultType(p,f,t);
          if(Object.values(p.connections).some(c=>c.from.entity===f&&(c.from.element||null)===el&&c.to===t)){line('same',`${el?nm(f)+' › “'+findElement(p,f,el).label+'”':nm(f)} already links to ${nm(t)}`);break}
          addConn(p,{entity:f,element:el},t,type,str(o.label));
          line('link',`${el?`“${findElement(p,f,el).label}” on ${nm(f)}`:nm(f)} → ${nm(t)} · ${CONN[type].label}${o.label?` (“${str(o.label)}”)`:''}`);break}
        case 'update':{
          const t=ent(o.target);if(!t)throw new Error('the card to change doesn\'t exist');
          const e=p.entities[t];const before=e.name;const done=[];
          for(const[k,v] of Object.entries(o.set||{})){try{setField(e,k,v);done.push(k==='name'?`name → “${e.name}”`:k==='status'?`status → ${e.status}`:k)}catch(err){line('skip',`Skipped changing ${k} on “${before}”: ${err.message}`)}}
          if(done.length)line('edit',`Change “${before}”: ${done.join(', ')}`);break}
        case 'updateElement':{
          const pg=ent(o.card);const el=pg&&findElement(p,pg,rid(o.element));if(!el)throw new Error('the button to change doesn\'t exist');
          const before=el.label;const set=o.set||{};const done=[];
          if(set.label!=null&&str(set.label)){el.label=str(set.label);done.push(`label → “${el.label}”`)}
          if(set.type&&EL_TYPES[set.type]){el.type=set.type;done.push(`type → ${EL_TYPES[set.type].label}`)}
          if(done.length)line('edit',`Change “${before}” on ${nm(pg)}: ${done.join(', ')}`);break}
        case 'removeLink':{const c=p.connections[o.id];if(!c)throw new Error('that link doesn\'t exist');line('del',`Remove link ${p.entities[c.from.entity]?nm(c.from.entity):'?'} → ${p.entities[c.to]?nm(c.to):'?'}`);delete p.connections[c.id];break}
        case 'removeCard':{const t=ent(o.target);if(!t)throw new Error('the card to delete doesn\'t exist');const n=inConns(p,t).length+outConns(p,t).length;line('del',`Delete ${nm(t)}${n?` and its ${n} link${n===1?'':'s'}`:''}`);removeEntity(p,t);break}

function derivedEdges(p){

  const add=d=>{const k=d.from.entity+'|'+(d.from.element||'')+'|'+d.to;if(seenKey.has(k))return;seenKey.add(k);out.push(d)};
  for(const c of Object.values(p.connections)){
    const a=p.entities[c.from.entity],b=p.entities[c.to];if(!a||!b||a.kind!=='page')continue;
    if(b.kind==='page'){add({id:c.id,connId:c.id,from:c.from,to:b.id,type:c.type,label:c.label,via:null});continue}
    if(!PASS.has(c.type))continue;

function canReach(from,s,n){
  const p=S.p;if(!p.entities[s.page])return{ok:false,why:`the page in step ${n} was deleted`};
  if(s.kind!=='tap'||!s.el)return{ok:true};
  const el=findElement(p,from,s.el);if(!el)return{ok:false,why:`the button it tapped is gone from “${entityLabel(p,from)}”`};
  const reach=derivedEdges(p).filter(d=>d.from.entity===from&&d.from.element===s.el).map(d=>d.to);
  if(reach.includes(s.page)||s.page===from)return{ok:true};
  if(PL.steps.length>1&&s.page===PL.steps[PL.steps.length-2].page&&outConns(p,from,s.el).some(c=>c.type==='back'))return{ok:true};

function startReplay(path){

  PL.steps=[Object.assign(clone(s0),{notes:[]})];PL.replay={path,i:0,paused:false,timer:null};PL.sheet=null;renderPlay();scheduleReplay();

function replayNext(){
  const r=PL.replay;if(!r)return;
  if(r.i>=r.path.steps.length-1){r.paused=true;renderPlay();toast('Replay finished');return}
  const s=r.path.steps[r.i+1];const ok=canReach(plCur().page,s,r.i+2);
  if(!ok.ok)return failReplay(r.path,r.i+1,ok.why);

function failReplay(path,i,why){stopReplay();PL.sheet={title:`Replay stopped at step ${i+1}`,text:`“${path.name}” can't carry on because ${why}.`,options:[{label:'OK',primary:true,run:()=>{}}]};renderPlay()}
function stopReplay(){if(PL.replay){clearTimeout(PL.replay.timer);PL.replay=null}}
function bindPlay(el){
  el.addEventListener('click',ev=>{
    const a=ev.target.closest('[data-pact]');
    if(a){if(a.disabled)return;const k=a.dataset.pact;
      if(k==='close')return closePlay();
      if(k==='back')return plBack();
      if(k==='restart'){PL.steps=[{...PL.steps[0],sim:{settings:{},inputs:{}},notes:[]}];PL.sheet=null;return renderPlay()}
      if(k==='jump'){PL.steps=PL.steps.slice(0,+a.dataset.i+1);PL.sheet=null;return renderPlay()}
      if(k==='mode'){PL.mode=playMode()==='dark'?'light':'dark';return renderPlay()}
      if(k==='info'){PL.showInfo=!PL.showInfo;return renderPlay()}
      if(k==='web')return openWeb(plCur().page,id=>{if(id!==plCur().page)arrive(id,{kind:'jump',via:'Jumped from the page web'})});
      if(k==='save')return savePathModal();
      if(k==='paths')return pathsSheet();
      if(k==='sheet'){const o=PL.sheet&&PL.sheet.options[+a.dataset.i];PL.sheet=null;if(o)o.run();return renderPlay()}
      if(k==='rp-toggle'){const r=PL.replay;if(!r)return;r.paused=!r.paused;if(!r.paused&&r.i>=r.path.steps.length-1){return startReplay(r.path)}renderPlay();return scheduleReplay()}
      if(k==='rp-next'){const r=PL.replay;if(!r)return;r.paused=true;clearTimeout(r.timer);return replayNext()}
      if(k==='rp-back'){const r=PL.replay;if(!r||r.i===0)return;clearTimeout(r.timer);r.paused=true;PL.steps.pop();r.i--;return renderPlay()}
      if(k==='rp-stop'){stopReplay();return renderPlay()}
      return;
    }
    if(ev.target.closest('.pl-under,.pl-sheet'))return;
    if(ev.target.closest('[data-plback]'))return plBack();
    const part=ev.target.closest('[data-pl]');if(part&&!ev.target.matches('input'))playTap(part.dataset.pl,part);
  });
  el.addEventListener('keydown',ev=>{const part=ev.target.closest&&ev.target.closest('[data-pl],[data-plback]');if(part&&(ev.key==='Enter'||ev.key===' ')&&!ev.target.matches('input')){ev.preventDefault();part.dataset.plback?plBack():playTap(part.dataset.pl,part)}});
  el.addEventListener('input',ev=>{const k=ev.target.dataset&&ev.target.dataset.in;if(k)plCur().sim.inputs[k]=ev.target.value});
  el.addEventListener('change',ev=>{const k=ev.target.dataset&&ev.target.dataset.pchg;if(k==='device'){PL.device=ev.target.value;renderPlay()}if(k==='role'){PL.role=ev.target.value;renderPlay()}});
}

  const D=derivedEdges(p);const outs=new Map(),ins=new Set();
  for(const d of D){if(d.from.entity===center&&d.to!==center&&!outs.has(d.to)){const el=d.from.element?findElement(p,center,d.from.element):null;outs.set(d.to,el?el.label:(d.label||''))}if(d.to===center&&d.from.entity!==center)ins.add(d.from.entity)}
  const r1=[...outs.keys()],r2=[...ins].filter(id=>!outs.has(id));let r3=pages.map(e=>e.id).filter(id=>id!==center&&!outs.has(id)&&!ins.has(id));
  const room=Math.max(0,40-r1.length-r2.length);const more=Math.max(0,r3.length-room);r3=r3.slice(0,room);
  const C=400;const pos=(ids,R,off)=>ids.map((id,i)=>{const a=-Math.PI/2+off+(i/Math.max(1,ids.length))*Math.PI*2;return{id,x:C+R*Math.cos(a),y:C+R*Math.sin(a)}});
