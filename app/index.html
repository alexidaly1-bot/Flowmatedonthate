  svg+=n2.map(n=>`<line x1="${n.x}" y1="${n.y}" x2="${C}" y2="${C}" style="stroke:var(--gold)" stroke-width="2.2" stroke-dasharray="6 5"/>`).join('');
  svg+=n1.map(n=>`<line x1="${C}" y1="${C}" x2="${n.x}" y2="${n.y}" style="stroke:var(--coral)" stroke-width="2.6"/>`).join('');
  svg+=n1.map(n=>{const lab=outs.get(n.id);if(!lab)return '';const mx=C+(n.x-C)*.55,my=C+(n.y-C)*.55;return `<text x="${mx}" y="${my-6}" text-anchor="middle" font-size="11" style="fill:var(--coral-text);paint-order:stroke;stroke:var(--bar);stroke-width:4px">${esc(short(lab))}</text>`}).join('');
  svg+=n3.map(n=>node(n,'w3')).join('')+n2.map(n=>node(n,'w2')).join('')+n1.map(n=>node(n,'w1')).join('');

    w.addEventListener('click',ev=>{const n=ev.target.closest('[data-wnode]');if(n){const f=w._pick;w.hidden=true;f&&f(n.dataset.wnode);return}if(ev.target.closest('[data-wact=close]')||ev.target===w)w.hidden=true});
    w.addEventListener('keydown',ev=>{if(ev.key==='Escape'){ev.stopPropagation();w.hidden=true}const n=ev.target.closest&&ev.target.closest('[data-wnode]');if(n&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();n.click()}})}

// PHASE 2–5: shared model helpers
// =========================================================
const ACTION_TYPES=['Navigate','Open / close overlay','Save data','Update data','Delete data','Set variable','Toggle on / off','Validate form','Upload file','Download file','Send notification','Start timer','Call outside service (API)','Sign in / authenticate','Check access permission','Conditional branch','Repeat over a list','Call reusable function'];
const PRIORITIES=['','Low','Medium','High','Critical'];
const STATE_KINDS=['','Temporary page state','Shared component state','Global app state','Saved user preference','Sign-in state','Server record','Cached data','Offline changes waiting to sync'];
const STORAGE=['','On the phone only','Cloud database','File storage','Outside service','Not stored'];
const SCOPES=['Whole app','One module','One page','One component'];
/* Fill in anything an older project file is missing. Never removes data. */
function normalizeProject(p){
  if(!p||p._norm===2)return p;
  for(const k of ['comments','tasks','assets','savedSearches','activity','customStatuses','paths'])if(!Array.isArray(p[k]))p[k]=[];
  if(!p.palettes||typeof p.palettes!=='object')p.palettes={history:[],favourites:[]};
  p.palettes.history=p.palettes.history||[];p.palettes.favourites=p.palettes.favourites||[];
  if(!p.docReviews||typeof p.docReviews!=='object')p.docReviews={};
  if(!p.roles)p.roles=[];
  for(const e of Object.values(p.entities||{}))normE(e);
  for(const s of p.paths)if(!s.expect)s.expect='';
  Object.defineProperty(p,'_norm',{value:2,enumerable:false,writable:true});
  return p;
}
function normE(e){if(!e)return e;if(!Array.isArray(e.acceptance))e.acceptance=[];if(e.kind==='function'&&!Array.isArray(e.perms))e.perms=[];if(e.kind==='setting'){if(!Array.isArray(e.overrides))e.overrides=[];if(!SCOPES.includes(e.scope))e.scope='Whole app'}if(e.kind==='page'&&!Array.isArray(e.elements))e.elements=[];if(!Array.isArray(e.roles))e.roles=[];return e}
const _addEntity=addEntity;addEntity=function(p,kind,props){return normE(_addEntity(p,kind,props))};
const allStatuses=p=>STATUSES.concat((p&&p.customStatuses||[]).filter(s=>s&&!STATUSES.includes(s)));
function pages(p){return Object.values(p.entities).filter(e=>e.kind==='page')}
function byKindP(p,k){return Object.values(p.entities).filter(e=>e.kind===k)}
function roleName(p,id){return (p.roles.find(r=>r.id===id)||{}).name||'(removed role)'}
/* Pages and functions that point at an entity (from the page itself or one of its buttons) */
function usersOf(p,id){const pgs=new Set(),fns=new Set();for(const c of inConns(p,id)){const f=p.entities[c.from.entity];if(!f)continue;if(f.kind==='page')pgs.add(f.id);else fns.add(f.id)}return {pages:[...pgs],others:[...fns]}}

// ---------- Settings: scope, inheritance and overrides ----------
function settingTargets(p,scope){
  if(scope==='One module')return Object.values(p.modules).map(m=>['mod:'+m.id,m.name]);
  if(scope==='One page')return pages(p).map(e=>['page:'+e.id,e.name]);
  if(scope==='One component')return byKindP(p,'component').map(e=>['cmp:'+e.id,e.name]);
  return [];
}
function targetName(p,t){if(!t)return 'Whole app';const[k,id]=t.split(':');if(k==='mod')return 'Module: '+((p.modules[id]||{}).name||'(removed)');if(k==='role')return 'Role: '+roleName(p,id);return (k==='page'?'Page: ':'Component: ')+entityLabel(p,id)}
/* The value a setting has on one page: page override, then module override, then default.
   Returns null when the setting doesn't apply to that page at all (its scope is another page or module). */
function effectiveSetting(p,set,pageId,roleId){
  if(!set)return null;const pg=pageId&&p.entities[pageId];const ov=set.overrides||[];
  if(set.scope==='One page'&&set.scopeTarget&&pageId&&set.scopeTarget!=='page:'+pageId)return null;
  if(set.scope==='One module'&&set.scopeTarget&&pg&&set.scopeTarget!=='mod:'+pg.moduleId)return null;
  const find=t=>ov.find(o=>o.target===t);
  let o=roleId&&find('role:'+roleId);if(o)return o.value;
  o=pg&&find('page:'+pg.id);if(o)return o.value;
  o=pg&&pg.moduleId&&find('mod:'+pg.moduleId);if(o)return o.value;
  return set.defaultValue;
}
/* Everything that mentions a setting: links to/from it, and functions, decisions or links whose text uses its key or name */
function settingRefs(p,set){
  const ids=new Set(),conns=new Set();
  for(const c of Object.values(p.connections)){if(c.to===set.id||c.from.entity===set.id){conns.add(c.id);ids.add(c.to===set.id?c.from.entity:c.to)}}
  const keys=[set.key,set.name].filter(x=>x&&x.length>2).map(x=>x.toLowerCase());
  if(keys.length){
    for(const e of Object.values(p.entities)){if(e.id===set.id)continue;const t=[e.steps,e.conditions,e.preconditions,e.desc,e.dataOps,e.trigger].join(' ').toLowerCase();if(keys.some(k=>t.includes(k)))ids.add(e.id)}
    for(const c of Object.values(p.connections)){if(keys.some(k=>(c.condition||'').toLowerCase().includes(k))){conns.add(c.id);ids.add(c.from.entity)}}
  }
  return {ids:[...ids].filter(i=>p.entities[i]),conns:[...conns]};
}

// ---------- Change Radius ----------
/* Works out what a change to one item could touch, before it happens. */
function impactOf(p,id,kind){
  const R={pages:new Set(),functions:new Set(),decisions:new Set(),components:new Set(),data:new Set(),settings:new Set(),conns:new Set(),tests:[]};
  const addE=eid=>{const e=p.entities[eid];if(!e||eid===id)return;({page:R.pages,function:R.functions,decision:R.decisions,component:R.components,data:R.data,setting:R.settings})[e.kind].add(eid)};
  const pagesUsing=eid=>{for(const c of inConns(p,eid)){R.conns.add(c.id);const f=p.entities[c.from.entity];if(!f)continue;addE(f.id);if(f.kind!=='page')for(const c2 of inConns(p,f.id)){const g=p.entities[c2.from.entity];if(g&&g.kind==='page'){addE(g.id);R.conns.add(c2.id)}}}};
  if(kind==='role'){
    for(const e of Object.values(p.entities)){if((e.roles||[]).includes(id)||(e.perms||[]).includes(id))addE(e.id)}
    for(const s of byKindP(p,'setting'))if((s.overrides||[]).some(o=>o.target==='role:'+id))addE(s.id);
  }else{
    const e=p.entities[id];if(!e)return R;
    for(const c of outConns(p,id)){R.conns.add(c.id);addE(c.to)}
    pagesUsing(id);
    if(e.kind==='setting'){const r=settingRefs(p,e);r.ids.forEach(x=>{addE(x);pagesUsing(x)});r.conns.forEach(c=>R.conns.add(c));for(const o of e.overrides||[]){const[k,t]=o.target.split(':');if(k==='page'||k==='cmp')addE(t)}}
    if(e.kind==='function'||e.kind==='decision'){for(const c of outConns(p,id)){const t=p.entities[c.to];if(t&&(t.kind==='function'||t.kind==='decision'))for(const c2 of outConns(p,t.id)){addE(c2.to);R.conns.add(c2.id)}}}
  }
  const touched=new Set([id,...R.pages,...R.functions,...R.decisions,...R.components]);
  for(const path of p.paths||[]){if((path.steps||[]).some(s=>touched.has(s.page)||(s.via&&touched.has(s.via))))R.tests.push(path.id)}
  return R;
}
function impactCount(R){return R.pages.size+R.functions.size+R.decisions.size+R.components.size+R.data.size+R.settings.size+R.tests.length}
function impactSummary(R,what){
  const parts=[[R.pages.size,'page'],[R.functions.size,'function'],[R.decisions.size,'decision'],[R.components.size,'component'],[R.data.size,'data item'],[R.settings.size,'setting'],[R.tests.length,'test scenario']].filter(x=>x[0]).map(([n,w])=>`${n} ${w}${n===1?'':'s'}`);
  if(!parts.length)return `Changing ${what} doesn't affect anything else.`;
  return `Changing ${what} may affect ${parts.length>1?parts.slice(0,-1).join(', ')+' and '+parts.slice(-1):parts[0]}.`;
}
function impactListHTML(p,R){
  const grp=(label,set)=>set.size?`<div class="mod-h">${label} <span class="count">${set.size}</span></div><div class="list">${[...set].map(i=>`<button class="li" data-act="radius-go" data-id="${i}">${icon(KINDS[p.entities[i].kind].icon)}<span class="grow">${esc(p.entities[i].name)}<small>${esc(KINDS[p.entities[i].kind].label)}</small></span></button>`).join('')}</div>`:'';
  return grp('Pages',R.pages)+grp('Functions',R.functions)+grp('Decisions',R.decisions)+grp('Components',R.components)+grp('Data',R.data)+grp('Settings',R.settings)+
    (R.tests.length?`<div class="mod-h">Test scenarios <span class="count">${R.tests.length}</span></div><div class="list">${R.tests.map(t=>{const x=p.paths.find(q=>q.id===t);return `<div class="li"><span class="grow">${esc(x?x.name:t)}<small>Run it again after the change</small></span></div>`}).join('')}</div>`:'');
}
function showRadius(id,kind){
  const p=S.p;const R=impactOf(p,id,kind);const name=kind==='role'?roleName(p,id):entityLabel(p,id);
  const ents=new Set([id,...R.pages,...R.functions,...R.decisions,...R.components,...R.data,...R.settings]);
  S.trace={ents,conns:R.conns,order:[name],dir:'radius',start:{id,el:null},summary:impactSummary(R,'“'+name+'”')};
  renderCanvas();applyTraceClasses();
}
/* Ask before a change that reaches other places. run() makes the change. */
function radiusConfirm(id,kind,verb,run,extraHTML=''){
  const p=S.p;const R=impactOf(p,id,kind);const name=kind==='role'?roleName(p,id):entityLabel(p,id);
  if(!impactCount(R)&&!extraHTML){run();return}
  openModal({title:`${verb} “${name}”?`,sub:'Change Radius',ic:'trace',wide:true,body:`<p class="cr-sum">${esc(impactSummary(R,'“'+name+'”'))}</p>${extraHTML}${impactListHTML(p,R)}<p class="help">Nothing changes until you confirm. Undo reverses it in one step.</p>`,
    actions:[{label:'Cancel',run:closeModal},{label:'Show on map',icon:'trace',run:()=>{closeModal();showRadius(id,kind)}},{label:verb,primary:true,run:()=>{closeModal();run()}}]});
}

    openModal({title:'Add an override',sub:set.name,ic:'sliders',body:`<div class="field"><label for="ov-t">Where it's different</label><select id="ov-t" class="inp">${t.map(([k,l])=>opt(k,'',l)).join('')}</select></div><div class="field"><label for="ov-v">Value there</label>${set.valueType==='On / off'?`<select id="ov-v" class="inp">${opt('On',isOnVal(set.defaultValue)?'Off':'On')}${opt('Off',isOnVal(set.defaultValue)?'Off':'On')}</select>`:`<input id="ov-v" class="inp" value="${esc(set.defaultValue)}">`}</div><p class="help">An override changes the value for one module, page or role. Everything else still follows the default.</p>`,

});
const _del=ACT['del-entity'];

// COLOURS: scheme generator, theme manager (for the app being planned)
// =========================================================
const CL=(()=>{
  const clamp01=x=>Math.min(1,Math.max(0,x));
  const hex2rgb=h=>{h=String(h).replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return [(n>>16)&255,(n>>8)&255,n&255]};
  const rgb2hex=c=>'#'+c.map(v=>Math.round(Math.min(255,Math.max(0,v))).toString(16).padStart(2,'0')).join('').toUpperCase();
  const lin=v=>{v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4)};
  const unlin=v=>255*(v<=.0031308?12.92*v:1.055*Math.pow(v,1/2.4)-.055);
  function toOklab(hex){const [r,g,b]=hex2rgb(hex).map(lin);
    const l=Math.cbrt(.4122214708*r+.5363325363*g+.0514459929*b),m=Math.cbrt(.2119034982*r+.6806995451*g+.1073969566*b),s=Math.cbrt(.0883024619*r+.2817188376*g+.6299787005*b);
    return [.2104542553*l+.793617785*m-.0040720468*s,1.9779984951*l-2.428592205*m+.4505937099*s,.0259040371*l+.7827717662*m-.808675766*s]}
  function fromOklabRaw(L,a,b){const l=Math.pow(L+.3963377774*a+.2158037573*b,3),m=Math.pow(L-.1055613458*a-.0638541728*b,3),s=Math.pow(L-.0894841775*a-1.291485548*b,3);
    return [4.0767416621*l-3.3077115913*m+.2309699292*s,-1.2684380046*l+2.6097574011*m-.3413193965*s,-.0041960863*l-.7034186147*m+1.707614701*s]}
  function oklch(hex){const [L,a,b]=toOklab(hex);let h=Math.atan2(b,a)*180/Math.PI;if(h<0)h+=360;return {l:L,c:Math.hypot(a,b),h}}
  /* OKLCH → hex, lowering chroma until the colour fits the screen's range */
  function fromOklch(l,c,h){l=clamp01(l);h=((h%360)+360)%360;let cc=Math.max(0,c);
    for(let i=0;i<40;i++){const a=cc*Math.cos(h*Math.PI/180),b=cc*Math.sin(h*Math.PI/180);const rgb=fromOklabRaw(l,a,b);if(rgb.every(v=>v>=-.0005&&v<=1.0005))return rgb2hex(rgb.map(v=>unlin(clamp01(v))));cc*=.9}
    return rgb2hex(fromOklabRaw(l,0,0).map(v=>unlin(clamp01(v))))}
  const lum=hex=>{const [r,g,b]=hex2rgb(hex).map(lin);return .2126*r+.7152*g+.0722*b};
  const contrast=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
  function hsl(hex){const [r,g,b]=hex2rgb(hex).map(v=>v/255);const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0;const l=(mx+mn)/2;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return {h:Math.round(h),s:Math.round(s*100),l:Math.round(l*100)}}
  const M={protanopia:[[.152286,1.052583,-.204868],[.114503,.786281,.099216],[-.003882,-.048116,1.051998]],deuteranopia:[[.367322,.860646,-.227968],[.280085,.672501,.047413],[-.01182,.04294,.968881]],tritanopia:[[1.255528,-.076749,-.178779],[-.078411,.930809,.147602],[.004733,.691367,.3039]]};
  function simulate(hex,type){const m=M[type];if(!m)return hex;const v=hex2rgb(hex).map(lin);return rgb2hex(m.map(r=>unlin(clamp01(r[0]*v[0]+r[1]*v[1]+r[2]*v[2]))))}
  /* Move a colour lighter or darker (keeping its hue) until it reaches the contrast target against bg */
  function fit(fg,bg,target){if(contrast(fg,bg)>=target)return fg;const o=oklch(fg);const darker=lum(bg)>.18;let best=fg;
    for(let i=1;i<=60;i++){const l=darker?o.l-i*.015:o.l+i*.015;if(l<0||l>1)break;const c=fromOklch(l,o.c,o.h);best=c;if(contrast(c,bg)>=target)return c}
    return contrast('#000000',bg)>contrast('#FFFFFF',bg)?'#000000':'#FFFFFF'}
  const bestOn=bg=>contrast('#FFFFFF',bg)>=contrast('#111111',bg)?'#FFFFFF':'#111111';
  const valid=h=>/^#?[0-9a-fA-F]{6}$/.test(String(h).trim())||/^#?[0-9a-fA-F]{3}$/.test(String(h).trim());
  const norm=h=>rgb2hex(hex2rgb(String(h).trim()));
  return {hex2rgb,rgb2hex,oklch,fromOklch,lum,contrast,hsl,simulate,fit,bestOn,valid,norm,toOklab,M};
})();

/* Pull the main colours out of a picture (k-means in a perceptual colour space) */
function extractColours(img,k=6){
  const cv=document.createElement('canvas');const W=72,H=Math.max(1,Math.round(72*img.naturalHeight/img.naturalWidth));cv.width=W;cv.height=H;
  const ctx=cv.getContext('2d');ctx.drawImage(img,0,0,W,H);const d=ctx.getImageData(0,0,W,H).data;const px=[];
  for(let i=0;i<d.length;i+=4){if(d[i+3]<128)continue;px.push(CL.toOklab(CL.rgb2hex([d[i],d[i+1],d[i+2]])))}
  if(!px.length)return [];
  px.sort((a,b)=>a[0]-b[0]);let C=[];for(let i=0;i<k;i++)C.push(px[Math.floor((i+.5)*px.length/k)].slice());
  let assign=new Array(px.length).fill(0);
  for(let it=0;it<12;it++){const sum=C.map(()=>[0,0,0,0]);
    for(let i=0;i<px.length;i++){let bi=0,bd=1e9;for(let j=0;j<C.length;j++){const dd=(px[i][0]-C[j][0])**2+(px[i][1]-C[j][1])**2+(px[i][2]-C[j][2])**2;if(dd<bd){bd=dd;bi=j}}assign[i]=bi;const s=sum[bi];s[0]+=px[i][0];s[1]+=px[i][1];s[2]+=px[i][2];s[3]++}
    C=C.map((c,j)=>sum[j][3]?[sum[j][0]/sum[j][3],sum[j][1]/sum[j][3],sum[j][2]/sum[j][3]]:c)}
  const cnt=C.map(()=>0);assign.forEach(a=>cnt[a]++);
  const toHex=c=>{const L=c[0],a=c[1],b=c[2];const h=(Math.atan2(b,a)*180/Math.PI+360)%360;return CL.fromOklch(L,Math.hypot(a,b),h)};
  let out=C.map((c,j)=>({hex:toHex(c),weight:cnt[j]/px.length})).filter(x=>x.weight>.01);
  // merge near-duplicates
  const res=[];for(const x of out.sort((a,b)=>b.weight-a.weight)){const o=CL.oklch(x.hex);const dup=res.find(r=>{const q=CL.oklch(r.hex);return Math.abs(q.l-o.l)<.05&&Math.hypot(q.c*Math.cos(q.h*Math.PI/180)-o.c*Math.cos(o.h*Math.PI/180),q.c*Math.sin(q.h*Math.PI/180)-o.c*Math.sin(o.h*Math.PI/180))<.03});if(dup)dup.weight+=x.weight;else res.push(x)}
  // roles
  res.sort((a,b)=>b.weight-a.weight);res.forEach(r=>{r.role=''});if(res[0])res[0].role='Dominant';if(res[1])res[1].role='Secondary';
  const acc=res.slice(2).filter(r=>CL.oklch(r.hex).c>.06).sort((a,b)=>CL.oklch(b.hex).c-CL.oklch(a.hex).c)[0];if(acc)acc.role='Accent';
  return res;
}
function analyseSet(cols){
  if(!cols.length)return '';const L=cols.map(c=>CL.oklch(c.hex));const w=cols.map(c=>c.weight||1/cols.length);const tw=w.reduce((a,b)=>a+b,0);
  const avg=f=>L.reduce((s,o,i)=>s+f(o)*w[i],0)/tw;const warm=L.reduce((s,o,i)=>s+((o.h<95||o.h>300)&&o.c>.03?w[i]:0),0)/tw;const cool=L.reduce((s,o,i)=>s+((o.h>=150&&o.h<=300)&&o.c>.03?w[i]:0),0)/tw;
  const light=L.reduce((s,o,i)=>s+(o.l>.6?w[i]:0),0)/tw;
  return `${warm>cool+.15?'Mostly warm':cool>warm+.15?'Mostly cool':'Warm and cool mixed'} · ${avg(o=>o.c)>.12?'saturated':avg(o=>o.c)>.06?'medium saturation':'muted'} · ${avg(o=>o.l)>.65?'light':avg(o=>o.l)<.4?'dark':'mid-tone'} · ${light>.65?'mostly light areas':light<.35?'mostly dark areas':'balanced light and dark'}`;
}
const WORD_HUES={red:25,rose:10,pink:350,coral:35,orange:55,peach:60,sunset:45,autumn:55,terracotta:40,rust:40,gold:85,yellow:95,sun:90,sand:80,beach:85,olive:115,lime:130,green:145,forest:150,leaf:140,mint:165,sage:150,teal:190,ocean:220,sea:210,sky:235,blue:255,navy:260,denim:250,indigo:275,purple:300,violet:295,lavender:290,plum:330,berry:345,wine:15,chocolate:45,coffee:50,earth:55,earthy:55,stone:70,slate:250,charcoal:260};
function wordsToSeeds(text){
  const t=String(text||'').toLowerCase();const seeds=[];let cS=1,lS=0;
  if(/\b(calm|soft|gentle|muted|quiet|relax)/.test(t))cS*=.6;if(/\b(bold|vivid|bright|energetic|playful|loud)/.test(t))cS*=1.4;if(/\b(pastel|airy|light)/.test(t)){lS+=.1;cS*=.6}if(/\b(dark|moody|night|deep|luxury|premium)/.test(t))lS-=.12;
  for(const[w,h] of Object.entries(WORD_HUES))if(new RegExp('\\b'+w).test(t))seeds.push(CL.fromOklch(.6+lS,.13*cS,h));
  if(!seeds.length&&t.trim())seeds.push(CL.fromOklch(.58+lS,.12*cS,(t.length*47)%360));
  return seeds.slice(0,4);
}

/* Build a full semantic palette for light and dark from seed colours */
const VARIANTS=[['closest','Closest to your colours'],['softer','Softer'],['warmer','Warmer'],['colourful','More colourful'],['contrast','Higher contrast'],['minimal','Minimal'],['dark','Dark-mode first']];
function makePalette(seeds,variant,locked=[]){
  const S0=seeds.map(h=>CL.norm(h));if(!S0.length)return null;
  const info=S0.map(h=>({hex:h,o:CL.oklch(h),locked:locked.includes(h)}));
  const byC=info.slice().sort((a,b)=>b.o.c-a.o.c);
  let pri=info.find(x=>x.locked)||byC[0];
  let sec=info.find(x=>x!==pri&&Math.abs(((x.o.h-pri.o.h+540)%360)-180)>25&&x.o.c>.03)||null;
  const acc=info.find(x=>x!==pri&&x!==sec&&x.o.c>.08)||null;
  let cS={softer:.6,colourful:1.35,minimal:.25}[variant]||1,hS=variant==='warmer'?1:0;
  const shiftH=h=>hS?h+((((55-h)+540)%360)-180)*.25:h;
  const ph=shiftH(pri.o.h),pc=Math.min(.32,pri.o.c*(variant==='minimal'?1:cS));
  const target=variant==='contrast'?7:4.5;
  const mk=mode=>{
    const dark=mode==='dark';const nc=variant==='minimal'?.004:Math.min(.02,pc*.12+.004)*(variant==='colourful'?1.6:1);
    const bg=dark?CL.fromOklch(.18,nc,ph):CL.fromOklch(variant==='softer'?.975:.985,nc,ph);
    const surface=dark?CL.fromOklch(.22,nc*1.2,ph):CL.fromOklch(.997,nc*.6,ph);
    const elevated=dark?CL.fromOklch(.26,nc*1.3,ph):'#FFFFFF';
    const text=CL.fit(dark?CL.fromOklch(.95,nc,ph):CL.fromOklch(.22,nc*1.4,ph),bg,variant==='contrast'?10:7);
    const textSecondary=CL.fit(dark?CL.fromOklch(.8,nc*1.4,ph):CL.fromOklch(.45,nc*1.6,ph),bg,target);
    let primary=pri.locked&&!dark?pri.hex:CL.fromOklch(dark?Math.max(.68,pri.o.l):Math.min(pri.o.l,.62),dark?Math.min(pc,.16):pc,ph);
    if(!pri.locked&&variant==='closest'&&!dark)primary=pri.hex;
    let onPrimary=CL.bestOn(primary);if(CL.contrast(onPrimary,primary)<target&&!(pri.locked&&!dark)){primary=CL.fit(primary,onPrimary,target)}
    const secBase=sec?sec.o:{l:pri.o.l,c:pc*.7,h:ph+(variant==='minimal'?0:30)};
    let secondary=CL.fromOklch(dark?.72:Math.min(secBase.l,.55),Math.min(.25,secBase.c*cS),shiftH(secBase.h));if(sec&&sec.locked&&!dark)secondary=sec.hex;
    const onSecondary=CL.bestOn(secondary);if(CL.contrast(onSecondary,secondary)<target&&!(sec&&sec.locked))secondary=CL.fit(secondary,onSecondary,target);
    const accent=acc?(acc.locked?acc.hex:CL.fromOklch(dark?.75:.6,Math.min(.25,acc.o.c*cS),shiftH(acc.o.h))):CL.fromOklch(dark?.75:.6,variant==='minimal'?pc:Math.min(.22,pc*1.1),ph+180);
    const link=CL.fit(primary,bg,target);
    const border=CL.fit(dark?CL.fromOklch(.42,nc*2,ph):CL.fromOklch(.72,nc*2,ph),bg,3);
    const selected=dark?CL.fromOklch(.3,Math.min(.08,pc*.5),ph):CL.fromOklch(.93,Math.min(.05,pc*.35),ph);
    const hover=dark?CL.fromOklch(.25,nc*2,ph):CL.fromOklch(.955,nc*2,ph);
    const disabled=dark?CL.fromOklch(.32,.005,ph):CL.fromOklch(.9,.005,ph);
    const disabledText=CL.fit(dark?CL.fromOklch(.62,.005,ph):CL.fromOklch(.55,.005,ph),disabled,3);
    const st=(h,c)=>CL.fit(CL.fromOklch(dark?.78:.5,c,h),bg,target);
    return {background:bg,surface,elevated,primary,onPrimary,secondary,onSecondary,accent,text,textSecondary,link,border,selected,hover,disabled,disabledText,success:st(150,.14),warning:st(70,.13),error:st(27,.17),info:st(245,.13)};
  };
  return {variant,name:(VARIANTS.find(v=>v[0]===variant)||[0,variant])[1],seeds:S0,locked:locked.slice(),light:mk('light'),dark:mk('dark'),created:Date.now()};
}
const ROLE_LABEL={background:'Main background',surface:'Surface',elevated:'Raised surface',primary:'Primary button',onPrimary:'Text on primary',secondary:'Secondary button',onSecondary:'Text on secondary',accent:'Accent',text:'Main text',textSecondary:'Secondary text',link:'Links',border:'Border',selected:'Selected',hover:'Hover',disabled:'Disabled',disabledText:'Disabled text',success:'Success',warning:'Warning',error:'Error',info:'Information'};

  return [ck('text','background','Main text on background',4.5),ck('textSecondary','background','Secondary text on background',4.5),ck('text','surface','Main text on surface',4.5),ck('onPrimary','primary','Text on primary button',4.5),ck('onSecondary','secondary','Text on secondary button',4.5),ck('link','background','Links on background',4.5),ck('border','background','Borders (non-text)',3),ck('success','background','Success text',4.5),ck('warning','background','Warning text',4.5),ck('error','background','Error text',4.5),ck('info','background','Information text',4.5),ck('disabledText','disabled','Disabled text (large)',3)];

// ---------- Looks for the planned app: app → module → page → role ----------
function lookFor(p,pageId,roleId){
  const out=Object.assign({},LOOK_DEF,p.look||{});const pg=pageId&&p.entities[pageId];
  const add=l=>{if(l)for(const[k,v] of Object.entries(l))if(v!=null&&v!=='')out[k]=v};
  if(pg&&pg.moduleId&&p.modules[pg.moduleId])add(p.modules[pg.moduleId].look);
  if(pg)add(pg.look);
  if(roleId){const r=p.roles.find(x=>x.id===roleId);if(r)add(r.look)}
  return out;
}
function scopeLook(p,scope){const[k,id]=scope.split(':');if(k==='app')return p.look;if(k==='mod')return (p.modules[id]||{}).look;if(k==='role')return (p.roles.find(r=>r.id===id)||{}).look;return (p.entities[id]||{}).look}
function scopeLabel(p,scope){const[k,id]=scope.split(':');if(k==='app')return 'Whole app';if(k==='mod')return 'Module: '+((p.modules[id]||{}).name||'?');if(k==='role')return 'Role: '+roleName(p,id);return (p.entities[id]&&p.entities[id].kind==='component'?'Component: ':'Page: ')+entityLabel(p,id)}
function setScopeLook(p,scope,look){const[k,id]=scope.split(':');if(k==='app'){p.look=look;return}if(k==='mod'){if(p.modules[id])p.modules[id].look=look;return}if(k==='role'){const r=p.roles.find(x=>x.id===id);if(r)r.look=look;return}if(p.entities[id])p.entities[id].look=look}
function allLookScopes(p){const out=[['app:',p.look]];for(const m of Object.values(p.modules))if(m.look)out.push(['mod:'+m.id,m.look]);for(const e of Object.values(p.entities))if(e.look)out.push(['ent:'+e.id,e.look]);for(const r of p.roles)if(r.look)out.push(['role:'+r.id,r.look]);return out.filter(x=>x[1])}
function lookColours(l){const c=new Set();if(!l)return c;if(l.primary)c.add(CL.norm(l.primary));if(l.palette)for(const m of ['light','dark'])for(const v of Object.values(l.palette[m]||{}))c.add(CL.norm(v));return c}

function condAnswers(p,d){return outConns(p,d.id).filter(k=>k.type!=='reference'&&k.type!=='read'&&p.entities[k.to]&&!['data','setting'].includes(p.entities[k.to].kind))}
function decisionSetting(p,d){return outConns(p,d.id).map(k=>p.entities[k.to]).find(e=>e&&e.kind==='setting')||inConns(p,d.id).map(k=>p.entities[k.from.entity]).find(e=>e&&e.kind==='setting')}
function suggestedAnswer(p,d,value){const conds=condAnswers(p,d);const on=isOnVal(value);const k=conds.find(k=>on?/^(yes|on|true|allowed|ok)/i.test(k.label||''):/^(no|off|false|not)/i.test(k.label||''));return k?(k.label||entityLabel(p,k.to)):null}
/* Decisions reached from a button (through functions and other decisions) */
function decisionsFrom(p,pageId,elId){const out=[];const seen=new Set();const q=outConns(p,pageId,elId).map(c=>c.to);
  while(q.length){const id=q.shift();if(seen.has(id))continue;seen.add(id);const e=p.entities[id];if(!e||e.kind==='page')continue;if(e.kind==='decision')out.push(e);if(seen.size<30)for(const c of outConns(p,id))if(PASS.has(c.type))q.push(c.to)}
  return out}
/* Run one saved journey against the current map, without opening Play */
function runScenario(p,path,over={}){
  const steps=path.steps||[];const res={id:path.id,name:path.name,ok:true,why:'',differs:[],at:Date.now(),steps:steps.length};
  if(!steps.length||!p.entities[steps[0].page])return Object.assign(res,{ok:false,why:'its start page was deleted'});
  for(let i=1;i<steps.length;i++){
    const from=steps[i-1].page,s=steps[i];const pg=p.entities[s.page];
    if(!pg){res.ok=false;res.why=`the page in step ${i+1} was deleted`;break}
    if(path.role&&pg.roles&&pg.roles.length&&!pg.roles.includes(path.role)){res.ok=false;res.why=`${roleName(p,path.role)} can't open “${pg.name}” any more`;break}
    if(s.kind==='tap'&&s.el){
      const el=findElement(p,from,s.el);if(!el){res.ok=false;res.why=`the button it tapped is gone from “${entityLabel(p,from)}”`;break}
      const reach=derivedEdges(p).filter(d=>d.from.entity===from&&d.from.element===s.el).map(d=>d.to);
      const back=i>1&&s.page===steps[i-2].page&&outConns(p,from,s.el).some(c=>c.type==='back');
      if(!reach.includes(s.page)&&s.page!==from&&!back){res.ok=false;res.why=`“${el.label}” no longer leads to “${pg.name}”`;break}
      if(s.choice)for(const d of decisionsFrom(p,from,s.el)){const set=decisionSetting(p,d);if(!set)continue;
        const base=(s.sim&&s.sim.settings&&s.sim.settings[set.id]!=null)?s.sim.settings[set.id]:effectiveSetting(p,set,from,path.role)??set.defaultValue;
        const v=over[set.id]!=null?over[set.id]:base;const sug=suggestedAnswer(p,d,v);
        if(sug&&sug!==s.choice&&condAnswers(p,d).some(k=>(k.label||entityLabel(p,k.to))===s.choice))res.differs.push({step:i+1,decision:d.name,setting:set.name,value:v,was:s.choice,now:sug})}
    }
  }
  if(res.ok&&path.expect&&steps[steps.length-1].page!==path.expect){res.ok=false;res.why=`it ends on “${entityLabel(p,steps[steps.length-1].page)}”, not the expected “${entityLabel(p,path.expect)}”`}
  if(res.ok&&res.differs.length){res.ok=false;res.why=`with these settings, “${res.differs[0].decision}” would answer “${res.differs[0].now}” instead of “${res.differs[0].was}”`}
  return res;
}

  return h;
}

const normL=s=>String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,'').trim();
function analyse(p){
  const A={journeys:[],consistency:[],contradictions:[],debt:[],forgotten:[],a11y:[]};
  const add=(k,msg,why,ref,prompt)=>A[k].push({msg,why,ref,prompt});const pg=pages(p);const all=Object.values(p.entities);const names=all.map(e=>normL(e.name)).join(' | ')+' | '+pg.flatMap(e=>e.elements.map(x=>normL(x.label))).join(' | ');
  const hasIn={};for(const c of Object.values(p.connections))hasIn[c.to]=true;
  // Missing journeys
  const login=pg.find(e=>e.pageType==='Login / registration'||/\b(log ?in|sign ?in)\b/i.test(e.name));
  if(login&&!/forgot|reset|recover/.test(names))add('journeys','Login exists but there is no way to recover a password.','People who forget their password get stuck.',{t:'entity',id:login.id},`Add a "Forgot password" flow from ${login.name}: a button, a reset page and a confirmation.`);
  for(const e of pg)for(const el of e.elements){
    if(!/save|submit|send|book|pay|confirm|report/i.test(el.label))continue;
    for(const c of outConns(p,e.id,el.id)){const f=p.entities[c.to];if(!f||f.kind!=='function')continue;
      const goesToPage=outConns(p,f.id).some(k=>{const t=p.entities[k.to];return t&&t.kind==='page'});
      if(!goesToPage&&!(f.success||'').trim())add('journeys',`“${el.label}” on ${e.name} runs ${f.name}, but nothing confirms it worked.`,'People need to know their form went through.',{t:'element',id:e.id,el:el.id},`After ${f.name} succeeds, show a confirmation (a message or a Confirmation page).`)}}
  for(const f of byKindP(p,'function')){const outs=outConns(p,f.id);if(outs.some(c=>c.type==='api')&&!outs.some(c=>c.type==='error')&&!(f.error||'').trim())add('journeys',`${f.name} calls an outside service but has no error path.`,'If the service is down, people see nothing happen.',{t:'entity',id:f.id},`Add an error path from ${f.name}: a retry and a friendly error message.`)}
  const restricted=pg.some(e=>e.roles.length);
  for(const r of p.roles){const mine=pg.filter(e=>!e.roles.length||e.roles.includes(r.id));if(restricted&&!pg.some(e=>e.roles.includes(r.id)))add('journeys',`The role “${r.name}” has no page made for it.`,'Every kind of user needs a clear first screen.',null,`Decide what ${r.name} sees first and add a landing page for them.`);

function logicViews(p,e,tech){

function findStart(p,q){
  const words=normL(q).split(/\s+/).filter(w=>w.length>2&&!STOP.has(w));const stem=w=>w.replace(/(ing|ed|es|s)$/,'');const ws=words.map(stem);
  let best=null,bs=0;const score=t=>{const tw=normL(t).split(/\s+/).filter(Boolean).map(stem);return ws.filter(w=>tw.some(x=>x.startsWith(w)||w.startsWith(x))).length};
  for(const e of pages(p)){let s=score(e.name)*.8;if(s>bs){bs=s;best={id:e.id}}for(const el of e.elements){const sc=score(el.label);const s2=sc?sc+(outConns(p,e.id,el.id).some(c=>p.entities[c.to]&&p.entities[c.to].kind!=='page')?.5:outConns(p,e.id,el.id).length?.3:0):0;if(s2>bs){bs=s2;best={id:e.id,el:el.id}}}}
  for(const f of byKindP(p,'function')){const s=score(f.name)*.9;if(s>bs){bs=s;best={id:f.id}}}
  const role=p.roles.find(r=>normL(q).includes(normL(r.name).split(' ')[0]));
  return bs>0?Object.assign(best,{role:role&&role.id}):null;
}
function walkSteps(p,start){

    if(t.kind!=='page'&&depth<6)q=q.concat(outConns(p,t.id).filter(k=>k.type!=='reference').map(k=>({c:k,depth:depth+1})));
    else if(t.kind==='page'&&++pagesSeen<3&&depth<6){const nx=t.elements.flatMap(el=>outConns(p,t.id,el.id)).filter(k=>{const x=p.entities[k.to];return x&&x.kind!=='page'}).slice(0,1);q=q.concat(nx.map(k=>({c:k,depth:depth+1})))}}

  else if(k==='page'){ids=[id];for(const c of Object.values(p.connections)){if(c.from.entity===id)ids.push(c.to);if(c.to===id)ids.push(c.from.entity)}}

const SR={q:'',kind:'',status:'',role:'',mod:''};
function smartSearch(p,q,f){
  const t=q.trim().toLowerCase();const out=[];const push=(r,why)=>out.push(Object.assign(r,{why}));let intent='';
  const pg=pages(p);
  if(/(don'?t|do not|doesn'?t|does not) do anything|go(es)? nowhere|not (linked|connected)|unconnected|dead/.test(t)){intent='Buttons that don\'t do anything yet';for(const e of pg)for(const el of e.elements)if(EL_TYPES[el.type]&&EL_TYPES[el.type].act&&!outConns(p,e.id,el.id).length)push({t:'element',id:e.id,el:el.id,name:el.label,sub:e.name},'Not linked')}
  else if(/(can|could) .*\b(access|see|open|use)\b|\baccess\b/.test(t)&&p.roles.some(r=>t.includes(normL(r.name).split(' ')[0]))){const r=p.roles.find(r=>t.includes(normL(r.name).split(' ')[0]));intent=`Everything ${r.name} can open`;for(const e of pg)if(!e.roles.length||e.roles.includes(r.id))push({t:'entity',id:e.id,name:e.name,sub:e.pageType},e.roles.length?'Allowed for '+r.name:'Open to everyone')}
  else if(/setting/.test(t)&&byKindP(p,'setting').some(s=>t.includes(normL(s.name))||(s.key&&t.includes(s.key.toLowerCase())))){const s=byKindP(p,'setting').find(s=>t.includes(normL(s.name))||(s.key&&t.includes(s.key.toLowerCase())));intent=`What uses ${s.name}`;const R=impactOf(p,s.id);for(const id of [...R.pages,...R.functions,...R.decisions])push({t:'entity',id,name:entityLabel(p,id),sub:KINDS[p.entities[id].kind].label},'Uses it')}
  else if(/where (does|do|is|are)? ?(the app )?(store|save|keep|stored|saved|kept)/.test(t)){const words=t.split(/\s+/).filter(w=>w.length>3);intent='Where data is kept';for(const d of byKindP(p,'data')){const hit=words.some(w=>normL(d.name+' '+(d.fields||'')).includes(w.replace(/s$/,'')));if(hit||words.length<3){push({t:'entity',id:d.id,name:d.name,sub:d.storage||'Storage not set'},'Data');for(const c of inConns(p,d.id))push({t:'entity',id:c.from.entity,name:entityLabel(p,c.from.entity),sub:'saves to '+d.name},'Writes it')}}}
  else if(/#[0-9a-f]{3,6}\b/.test(t)){const hx=CL.norm(t.match(/#[0-9a-f]{3,6}\b/)[0]);intent='Where '+hx+' is used';for(const[sc,l] of allLookScopes(p))if(lookColours(l).has(hx))push(sc.startsWith('ent:')?{t:'entity',id:sc.slice(4),name:entityLabel(p,sc.slice(4)),sub:'Colours'}:{t:'none',name:scopeLabel(p,sc==='app:'?'app:':sc),sub:'Colours'},'Uses it')}
  else if(/\berror/.test(t)&&!f.kind){intent='Error paths';for(const c of Object.values(p.connections))if(c.type==='error')push({t:'entity',id:c.from.entity,name:connFromLabel(p,c),sub:'→ '+entityLabel(p,c.to)},'Error path');for(const e of pg)if(e.pageType==='Error')push({t:'entity',id:e.id,name:e.name,sub:'Error page'},'Page')}
  if(!intent){const st=allStatuses(p).find(s=>t===s.toLowerCase());if(st){intent='Status: '+st;f=Object.assign({},f,{status:st})}}
  if(!intent){const words=t.split(/\s+/).filter(Boolean);
    for(const e of Object.values(p.entities)){const hay=normL([e.name,e.desc,e.notes,e.steps,e.key,e.why,e.rules,e.decisions].join(' '));if(!words.length||words.every(w=>hay.includes(w)))push({t:'entity',id:e.id,name:e.name,sub:KINDS[e.kind].label+(e.kind==='page'?' · '+e.pageType:'')},'');
      if(e.elements)for(const el of e.elements)if(words.length&&words.every(w=>normL(el.label).includes(w)))push({t:'element',id:e.id,el:el.id,name:el.label,sub:e.name},'Part')}}
  const ent=r=>r.id&&p.entities[r.id];
  const res=out.filter(r=>{const e=ent(r);if(!e)return r.t==='none';if(f.kind&&e.kind!==f.kind)return false;if(f.status&&e.status!==f.status)return false;if(f.mod&&e.moduleId!==f.mod)return false;if(f.role&&e.kind==='page'&&e.roles.length&&!e.roles.includes(f.role))return false;return true});

}

// Ask: text, images, or both; reuse an identical answer; never two requests at once
saAsk=async function(force){
  if(AI.state==='thinking')return;
  const text=(AI.text||'').trim();const imgs=saImagesOn()?AI.imgs.slice():[];
  if(!text&&!imgs.length){toast(saImagesOn()?'Type, say or add an image first':'Type or say what you want first');$('#sa-in')?.focus();return}
  if(!AI.sample){AI.err=AI_ERR.capability_disabled;renderSA();return}
  if(imgs.length&&(await saImgLimits())===false){AI.err='Images can\'t be sent from here. Remove them, or describe what they show in words.';renderSA();return}
  if(AI.dict&&AI.listening){try{await AI.dict.stop()}catch(e){}}
  const request=text||'(No words given, only images.) Look at the attached images, work out what they show, and suggest what to add or change in this map to match. Say briefly what you saw in "understood".';
  let prompt=buildPrompt(S.p,request,AI.scope,S.sel,AI.turns);
  if(imgs.length)prompt+=`\n\nATTACHED IMAGES, in this order (the user may refer to them by these names):\n${imgs.map((x,i)=>`${i+1}. "${x.label.replace(/"/g,"'")}"${x.name?` (file ${x.name.replace(/"/g,"'")})`:''}`).join('\n')}\nUse what the images show (screens, sketches, flows, colours, labels). If an image is unclear, say so in "understood" rather than guessing.`;
  const key=[hashStr(request),AI.scope,S.sel?JSON.stringify(S.sel):'',imgs.map(x=>x.id+':'+x.label).join(',')].join('|');
  if(!force&&AI.cache.has(key)&&AI.cache.get(key).rev===S.p.rev){AI.res=JSON.parse(JSON.stringify(AI.cache.get(key).res));previewAll();AI.chosen=AI.res.options.length===1?0:-1;AI.state='result';AI.err='';renderSA();toast('Same request as before, so here are those options again. Tap Try again for new ones.');return}
  AI.ctl=new AbortController();AI.state='thinking';AI.err='';AI.res=null;AI.chosen=-1;AI.stale=false;AI.progress=0;renderSA();
  let last=0;
  try{
    const opts={signal:AI.ctl.signal,cache:false,modelTier:'default',onText:({text})=>{AI.progress=text.length;if(text.length-last>400){last=text.length;const t=$('.sa-think span:nth-child(2)');if(t)t.innerHTML=`Writing the plan… <small class="help">${Math.round(text.length/100)/10}k characters</small>`}}};
    if(imgs.length)opts.images=imgs.map(x=>x.blob);
    const raw=await AI.sample.json(prompt,opts);
    AI.res=normaliseResult(raw);
    AI.cache.set(key,{rev:S.p.rev,res:JSON.parse(JSON.stringify(AI.res))});if(AI.cache.size>8)AI.cache.delete(AI.cache.keys().next().value);
    previewAll();
    if(AI.res.options.length===1)AI.chosen=0;
    AI.turns.push({request:(text||'(images only)')+(imgs.length?` [with ${imgs.map(x=>x.label).join(', ')}]`:''),options:AI.res.options.map(o=>o.title),chosen:null});if(AI.turns.length>6)AI.turns.shift();
    AI.state='result';
  }catch(e){
    AI.state='ask';
    if(e&&e.code==='cancelled'){AI.err=''}
    else{AI.err=AI_ERR[e&&e.code]||AI_ERR.upstream_error;if(e&&['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e.code))AI.sample=null}
  }finally{AI.ctl=null}
  renderSA();
};
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}

const DEFAULT_LABEL=/^(New (button|link|tab|list item|menu item|toggle|text field|dropdown|image|section|part)|New section)$/i;
const _scrHTML6=screenHTML;
screenHTML=function(p,e,o={}){
  let h=_scrHTML6(p,e,o);
  const els=e.elements||[];
  if(!els.length)h=h.replace('<div class="scr','<div class="scr undesigned').replace('<p class="scr-empty">Drag parts here</p>',`<div class="scr-todo"><b>Not designed yet</b><span>${o.mode==='play'?'This screen has no parts yet':'Add parts from the Parts bar'}</span></div>`);
  for(const el of els)if(!String(el.label||'').trim()||DEFAULT_LABEL.test(el.label))h=h.replace(new RegExp(`class="sp ([^"]*)" data-el="${el.id}"`),`class="sp $1 unnamed" data-el="${el.id}"`);

};
const FREE_TPL=document.createElement('template');
function freeBoxes(e,W){
  // saved boxes, plus a tidy stack for parts that do not have one yet
  const out={};let bottom=12;
  for(const el of e.elements||[])if(el.box){out[el.id]=el.box;bottom=Math.max(bottom,(el.box.y+el.box.h)*W+10)}
  for(const el of e.elements||[])if(!el.box){const h=Math.max(34,(PART_H[el.type]||60)-12);out[el.id]={x:16/W,y:bottom/W,w:(W-32)/W,h:h/W,auto:1};bottom+=h+10}

function freeify(h,e,o){

  const body=scr.querySelector('.scr-body');if(!body)return h;
  const parts=[...scr.querySelectorAll('.sp[data-el]')].filter(n=>!n.classList.contains('faint'));
  scr.querySelectorAll('.sp.faint,.sp-hero,.scr-empty').forEach(n=>n.remove());
  const foot=scr.querySelector('.scr-foot');
  body.innerHTML='';body.classList.add('free');
  const B=freeBoxes(e,W);let max=0;
  for(const n of parts){const b=B[n.dataset.el];if(!b)continue;n.classList.add('fp');n.style.cssText+=`;left:${Math.round(b.x*W)}px;top:${Math.round(b.y*W)}px;width:${Math.round(b.w*W)}px;height:${Math.round(b.h*W)}px`;body.appendChild(n);max=Math.max(max,(b.y+b.h)*W)}
  if(foot)foot.remove();

}

function layFit(){const st=$('#lay-stage'),fit=$('#lay-fit');if(!st||!fit)return;const dv=fit.firstElementChild;const W=dv.offsetWidth,H=dv.offsetHeight;const s=Math.max(.3,Math.min(1.4,(st.clientWidth-24)/W,(st.clientHeight-24)/H));LAY.scale=s;dv.style.transform=`scale(${s})`;dv.style.setProperty("--hs",(1/s).toFixed(2));fit.style.width=Math.round(W*s)+'px';fit.style.height=Math.round(H*s)+'px'}

function logDiff(a,b){

  const POS=new Set(['x','y','sx','sy','updatedAt','elements','collapsed']);
  for(const id in b.entities){const e=b.entities[id],o=a.entities[id];
    if(!o){ch.push({op:'added',k:e.kind,n:nm(e)});continue}
    if(o===e||J(o)===J(e))continue;
    const f=[];for(const k of new Set([...Object.keys(o),...Object.keys(e)]))if(!POS.has(k)&&J(o[k])!==J(e[k]))f.push(k);
    if(f.length)ch.push({op:'edited',k:e.kind,n:nm(e),f});
    if(o.x!==e.x||o.y!==e.y||o.sx!==e.sx||o.sy!==e.sy)moved++;
    const oe=new Map((o.elements||[]).map(x=>[x.id,x])),ne=new Map((e.elements||[]).map(x=>[x.id,x]));
    for(const[eid,x] of ne){const y=oe.get(eid);if(!y)ch.push({op:'added',k:'part',n:x.label,in:nm(e)});else if(J(x)!==J(y))ch.push({op:'edited',k:'part',n:x.label,in:nm(e),f:Object.keys(Object.assign({},x,y)).filter(k=>J(x[k])!==J(y[k]))})}
    for(const[eid,y] of oe)if(!ne.has(eid))ch.push({op:'removed',k:'part',n:y.label,in:nm(e)});
    if((o.elements||[]).length===(e.elements||[]).length&&(o.elements||[]).length>1&&J((o.elements||[]).map(x=>x.id))!==J((e.elements||[]).map(x=>x.id)))ch.push({op:'edited',k:'page',n:nm(e),f:['order of parts']});
  }
  for(const id in a.entities)if(!b.entities[id])ch.push({op:'removed',k:a.entities[id].kind,n:nm(a.entities[id])});
  const lk=(p,c)=>{const f=p.entities[c.from.entity],t=p.entities[c.to];let s=nm(f);if(c.from.element&&f){const el=(f.elements||[]).find(x=>x.id===c.from.element);if(el)s+=' › '+el.label}return s+' → '+nm(t)+(c.label?` (${c.label})`:'')};
  for(const id in b.connections){const c=b.connections[id],o=a.connections[id];if(!o)ch.push({op:'connected',k:c.type,n:lk(b,c)});else if(J(o)!==J(c))ch.push({op:'edited',k:'link',n:lk(b,c)})}

  for(const id in b.modules||{}){const m=b.modules[id],o=(a.modules||{})[id];if(!o)ch.push({op:'added',k:'module',n:m.name});else if(J(o)!==J(m))ch.push({op:'edited',k:'module',n:m.name})}

  const ar=new Map((a.roles||[]).map(r=>[r.id,r]));for(const r of b.roles||[]){const o=ar.get(r.id);if(!o)ch.push({op:'added',k:'role',n:r.name});else if(J(o)!==J(r))ch.push({op:'edited',k:'role',n:r.name})}
  for(const r of a.roles||[])if(!(b.roles||[]).some(x=>x.id===r.id))ch.push({op:'removed',k:'role',n:r.name});
  for(const k of ['name','description','platforms','look','startPageId'])if(J(a[k])!==J(b[k]))ch.push({op:'edited',k:'app',n:{name:'app name',description:'app description',platforms:'platforms',look:'app look and colours',startPageId:'start page'}[k]});
